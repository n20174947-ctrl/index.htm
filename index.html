<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:160px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введи или вставь сюда текст..."></textarea>

<div class="controls">

<label>
Стиль почерка
<select id="style">

<option value="marck">
Реалистичный — Marck Script
</option>

<option value="badscript">
Небрежный — Bad Script
</option>

<option value="kalam">
Живой — Kalam
</option>

<option value="caveat">
Небрежный — Caveat
</option>

<option value="neucha">
Аккуратный — Neucha
</option>

<option value="pangolin">
Детский — Pangolin
</option>

</select>
</label>


<label>
Бумага

<select id="paper">

<option value="plain">
Чистая
</option>

<option value="tetrad1">
Тетрадь — левая поля
</option>

<option value="tetrad2">
Тетрадь — правая поля
</option>

</select>

</label>


<div class="option">

<label>
Размер:
<span id="sizeValue">32</span> px
</label>

<input
id="size"
type="range"
min="18"
max="60"
value="32">

</div>


<div class="option">

<label>
Поля:
<span id="marginValue">70</span> px
</label>

<input
id="margin"
type="range"
min="30"
max="160"
value="70">

</div>


<div class="option">

<label>
Интервал:
<span id="lineValue">1.45</span>
</label>

<input
id="line"
type="range"
min="1"
max="2"
step="0.05"
value="1.45">

</div>

</div>


<div class="option" style="margin-top:10px;">

<label>
Отступ текста X:
<span id="xOffsetValue">80</span> px
</label>

<input
id="xOffset"
type="range"
min="0"
max="180"
value="80">

</div>


<div class="option" style="margin-top:10px;">

<label>
Ширина текста:
<span id="widthValue">800</span> px
</label>

<input
id="width"
type="range"
min="200"
max="1100"
value="800">

</div>


<button id="create">
Создать лист
</button>

<button id="save">
Сохранить PNG
</button>


<div class="preview">

<canvas
id="canvas"
width="1240"
height="1754">
</canvas>

</div>

</div>
</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const text =
document.getElementById("text");

const paper =
document.getElementById("paper");

const style =
document.getElementById("style");

const size =
document.getElementById("size");

const margin =
document.getElementById("margin");

const line =
document.getElementById("line");

const xOffset =
document.getElementById("xOffset");

const width =
document.getElementById("width");


/* =========================
   ПОЛЗУНКИ
========================= */

function updateValues(){

    document.getElementById(
        "sizeValue"
    ).textContent = size.value;

    document.getElementById(
        "marginValue"
    ).textContent = margin.value;

    document.getElementById(
        "lineValue"
    ).textContent = line.value;

    document.getElementById(
        "xOffsetValue"
    ).textContent = xOffset.value;

    document.getElementById(
        "widthValue"
    ).textContent = width.value;
}


/* =========================
   ФОН ТЕТРАДИ
========================= */

function getImageSrc(){

    if(paper.value === "tetrad1"){
        return "tetrad1.jpg";
    }

    if(paper.value === "tetrad2"){
        return "tetrad2.jpg";
    }

    return "";
}


function drawPaper(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(paper.value === "plain"){

        ctx.fillStyle =
            "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const src =
        getImageSrc();


    const img =
        new Image();


    img.onload = function(){

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();
    };


    img.onerror = function(){

        ctx.fillStyle =
            "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();
    };


    img.src = src;
}


/* =========================
   ШРИФТЫ
========================= */

function getFont(){

    if(style.value === "marck")
        return "Marck Script";

    if(style.value === "badscript")
        return "Bad Script";

    if(style.value === "kalam")
        return "Kalam";

    if(style.value === "caveat")
        return "Caveat";

    if(style.value === "neucha")
        return "Neucha";

    if(style.value === "pangolin")
        return "Pangolin";

    return "Marck Script";
}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function random(min,max){

    return Math.random() *
        (max-min) + min;
}


/* =========================
   ПЕРЕНОС СТРОК
========================= */

function wrapText(
    str,
    maxWidth
){

    const words =
        str.split(/\s+/);

    const result = [];

    let current = "";


    for(
        const word of words
    ){

        const test =
            current
            ? current + " " + word
            : word;


        if(
            ctx.measureText(test).width
            > maxWidth
            &&
            current
        ){

            result.push(
                current
            );

            current = word;

        }else{

            current = test;
        }
    }


    if(current){

        result.push(
            current
        );
    }


    return result;
}


/* =========================
   НАТУРАЛЬНЫЙ ПОЧЕРК
========================= */

function drawHandwrittenLine(
    str,
    x,
    y
){

    let currentX = x;


    /*
      Каждая буква получает
      небольшое отличие.

      Важно:
      отличие маленькое,
      поэтому слово остается
      цельным.
    */


    for(
        let i = 0;
        i < str.length;
        i++
    ){

        const character =
            str[i];


        if(character === " "){

            currentX +=
                ctx.measureText(" ").width
                *
                random(0.85,1.25);

            continue;
        }


        const charWidth =
            ctx.measureText(
                character
            ).width;


        /*
          Небольшое смещение
          вверх / вниз
        */

        const yMove =
            random(-1.5,1.5);


        /*
          Небольшой наклон.
        */

        const rotation =
            random(-0.035,0.035);


        /*
          Иногда буква немного
          меньше или больше.
        */

        const scale =
            random(0.96,1.04);


        ctx.save();


        ctx.translate(
            currentX,
            y + yMove
        );


        ctx.rotate(
            rotation
        );


        ctx.scale(
            scale,
            scale
        );


        ctx.fillText(
            character,
            0,
            0
        );


        ctx.restore();


        /*
          Небольшая неровность
          расстояния между буквами.
        */

        currentX +=
            charWidth +
            random(-0.35,0.45);
    }
}


/* =========================
   ОСНОВНАЯ ГЕНЕРАЦИЯ
========================= */

function createText(){

    const fontSize =
        Number(size.value);

    const m =
        Number(margin.value);

    const spacing =
        Number(line.value);

    const xOff =
        Number(xOffset.value);

    const maxW =
        Number(width.value);


    /*
      Для выбранного тобой
      почерка автоматически
      делаем его немного крупнее.
    */

    ctx.font =
        fontSize +
        "px " +
        getFont() +
        ", cursive";


    /*
      Цвет синей ручки.
    */

    ctx.fillStyle =
        "#16449b";


    /*
      Лёгкая прозрачность,
      как настоящая шариковая ручка.
    */

    ctx.globalAlpha =
        0.90;


    ctx.textBaseline =
        "alphabetic";


    const lineHeight =
        fontSize * spacing;


    let y =
        m + fontSize;


    const paragraphs =
        text.value
        .replace(/\r/g,"")
        .split("\n");


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.clip();


    for(
        const paragraph of paragraphs
    ){

        if(
            !paragraph.trim()
        ){

            y +=
                lineHeight;

            continue;
        }


        const lines =
            wrapText(
                paragraph,
                maxW
            );


        for(
            const currentLine of lines
        ){

            if(
                y >
                canvas.height - 40
            ){

                break;
            }


            /*
              Каждая строка имеет
              чуть-чуть свой наклон.
            */

            const lineTilt =
                random(
                    -0.0015,
                    0.0015
                );


            ctx.save();


            ctx.translate(
                xOff,
                y
            );


            ctx.rotate(
                lineTilt
            );


            /*
              Сам текст рисуем
              начиная с 0,
              потому что уже сделали
              translate.
            */

            drawHandwrittenLine(
                currentLine,
                0,
                0
            );


            ctx.restore();


            /*
              Небольшая разница
              между строками.
            */

            y +=
                lineHeight +
                random(-0.5,0.8);
        }
    }


    ctx.restore();


    ctx.globalAlpha = 1;
}


/* =========================
   СОЗДАТЬ
========================= */

document
.getElementById("create")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();
    }
);


/* =========================
   СОХРАНИТЬ
========================= */

document
.getElementById("save")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();


        setTimeout(
            function(){

                const link =
                    document.createElement("a");


                link.download =
                    "HandWrite-A4.png";


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                link.click();

            },
            300
        );
    }
);


/* =========================
   ИЗМЕНЕНИЕ НАСТРОЕК
========================= */

[
    paper,
    style,
    size,
    margin,
    line,
    xOffset,
    width

].forEach(
    function(element){

        element.addEventListener(
            "input",
            function(){

                updateValues();

                drawPaper();
            }
        );


        element.addEventListener(
            "change",
            function(){

                updateValues();

                drawPaper();
            }
        );
    }
);


/* =========================
   ЗАПУСК
========================= */

updateValues();


document.fonts.ready.then(
    function(){

        drawPaper();
    }
);

</script>

</body>
</html>
