<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const paper = document.getElementById("paper");

function getImageSrc(){
    if(paper.value === "tetrad1"){
        return "./tetrad1.jpg";
    }

    if(paper.value === "tetrad2"){
        return "./tetrad2.jpg";
    }

    return "";
}

function drawPaper(){

    const src = getImageSrc();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if(!src){
        ctx.fillStyle = "#fffdf8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
    }

    const img = new Image();

    img.onload = function(){

        console.log("ТЕТРАДЬ ЗАГРУЖЕНА:", img.width, img.height);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

    };

    img.onerror = function(){

        console.log("ОШИБКА:", src);

        ctx.fillStyle = "red";
        ctx.font = "30px Arial";

        ctx.fillText(
            "ОШИБКА ЗАГРУЗКИ",
            50,
            80
        );

    };

    img.src = new URL(
        src,
        window.location.href
    ).href + "?v=" + Date.now();
}

paper.addEventListener(
    "change",
    drawPaper
);

drawPaper();
</script>
