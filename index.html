<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HandWrite A4 — реалистичный почерк</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&family=Shantell+Sans:wght@400;500&display=swap");

@font-face{font-family:"RinMyHandwriting";src:url("./Rin_MyHandwriting_Prototype.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Victor";src:url("./victor-handwriting.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Discipuli";src:url("./Discipuli_Britannica%20(1).ttf") format("truetype");font-display:swap}
@font-face{font-family:"Domosed";src:url("./Domosed_vc%20(1).ttf") format("truetype");font-display:swap}
@font-face{font-family:"PecitaLocal";src:url("./Pecita.ttf") format("truetype");font-display:swap}
@font-face{font-family:"SegoeScriptLocal";src:url("./Segoe_Script.ttf") format("truetype");font-display:swap}

*{box-sizing:border-box}
body{margin:0;padding:12px;background:#eee;font-family:Arial,sans-serif;color:#222}
.panel{max-width:900px;margin:auto;background:white;padding:14px;border-radius:12px;box-shadow:0 3px 15px #0002}
h1{text-align:center;margin:5px 0 18px;font-size:24px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.control{flex:1;min-width:170px}
label{display:block;font-size:14px;margin-bottom:5px;font-weight:bold}
select,input[type=range]{width:100%}
select{height:37px;border:1px solid #ccc;border-radius:7px;padding:4px 8px;background:white}
textarea{width:100%;min-height:140px;margin-top:12px;padding:10px;border:1px solid #ccc;border-radius:8px;resize:vertical;font-size:16px;font-family:Arial,sans-serif}
details{margin-top:10px;border:1px solid #ddd;border-radius:8px;padding:8px 10px}
summary{cursor:pointer;font-weight:bold;padding:4px}
.slider{margin:11px 0}
.slider-title{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.buttons{display:flex;gap:10px;margin-top:15px}
button{flex:1;border:0;border-radius:8px;padding:12px;font-size:16px;cursor:pointer;background:#222;color:white}
button:disabled{opacity:.55}
.paper-wrap{position:relative;width:min(100%,620px);margin:25px auto 0;line-height:0;box-shadow:0 4px 18px #0003;background:white;overflow:hidden}
#paperImage{display:block;width:100%;height:auto}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
@media(max-width:500px){
  body{padding:7px}
  .panel{padding:10px}
  .control{min-width:135px}
  .buttons button{font-size:14px;padding:11px 5px}
}
</style>
</head>
<body>
<div class="panel">
<h1>✍️ HandWrite A4</h1>

<div class="row">
  <div class="control">
    <label for="style">Стиль почерка</label>
    <select id="style">
      <option value="Victor">Виктор</option>
      <option value="Discipuli">Discipuli Britannica</option>
      <option value="Domosed">Domosed</option>
      <option value="PecitaLocal">Pecita</option>
      <option value="SegoeScriptLocal">Segoe Script</option>
      <option value="RinMyHandwriting">Мой почерк</option>
      <option value="Shantell Sans">Shantell Sans</option>
      <option value="Bad Script">Bad Script</option>
      <option value="Caveat">Caveat</option>
      <option value="Kalam">Kalam</option>
      <option value="Marck Script">Marck Script</option>
      <option value="Neucha">Neucha</option>
      <option value="Pangolin">Pangolin</option>
    </select>
  </div>

  <div class="control">
    <label for="paper">Бумага</label>
    <select id="paper">
      <option value="tetrad1">Тетрадь 1</option>
      <option value="tetrad2">Тетрадь 2</option>
      <option value="tetrad3">Тетрадь 3</option>
      <option value="tetrad4">Тетрадь 4</option>
      <option value="tetrad5">Тетрадь 5</option>
      <option value="tetrad6" selected>Тетрадь 6</option>
    </select>
  </div>

  <div class="control">
    <label for="inkColor">Цвет ручки</label>
    <select id="inkColor">
      <option value="blue">Синий</option>
      <option value="darkblue" selected>Чернильно-синий</option>
      <option value="black">Чёрный</option>
    </select>
  </div>

  <div class="control">
    <label for="alignment">Выравнивание</label>
    <select id="alignment">
      <option value="left" selected>Слева</option>
      <option value="center">По центру</option>
      <option value="right">Справа</option>
    </select>
  </div>
</div>

<textarea id="text" placeholder="Введите текст здесь..."></textarea>

<details open>
<summary>✏️ Размер текста</summary>
<div class="slider">
  <div class="slider-title"><span>Размер</span><span id="sizeVal">30</span></div>
  <input id="size" type="range" min="16" max="60" value="30">
</div>
<div class="slider">
  <div class="slider-title"><span>Межстрочный интервал</span><span id="lineVal">1</span></div>
  <input id="line" type="range" min="0.7" max="1.5" step="0.05" value="1">
</div>
</details>

<details>
<summary>🖊️ Реалистичность почерка</summary>
<div class="slider">
  <div class="slider-title"><span>Общий наклон</span><span id="slantVal">0</span></div>
  <input id="slant" type="range" min="-8" max="8" value="0">
</div>
<div class="slider">
  <div class="slider-title"><span>Неровность букв</span><span id="jitterVal">8</span></div>
  <input id="jitter" type="range" min="0" max="15" step="0.5" value="8">
</div>
<div class="slider">
  <div class="slider-title"><span>Расстояние между словами</span><span id="wordVal">1</span></div>
  <input id="word" type="range" min="0.5" max="2" step="0.1" value="1">
</div>
<div class="slider">
  <div class="slider-title"><span>Насыщенность чернил</span><span id="inkVal">92</span></div>
  <input id="ink" type="range" min="60" max="100" value="92">
</div>
</details>

<details>
<summary>📐 Положение текста</summary>
<div class="slider">
  <div class="slider-title"><span>Отступ сверху</span><span id="topVal">0</span></div>
  <input id="top" type="range" min="-100" max="300" value="0">
</div>
<div class="slider">
  <div class="slider-title"><span>Отступ слева</span><span id="leftVal">0</span></div>
  <input id="left" type="range" min="-100" max="300" value="0">
</div>
<div class="slider">
  <div class="slider-title"><span>Смещение X</span><span id="xVal">0</span></div>
  <input id="x" type="range" min="-300" max="300" value="0">
</div>
<div class="slider">
  <div class="slider-title"><span>Смещение Y</span><span id="yVal">0</span></div>
  <input id="y" type="range" min="-300" max="300" value="0">
</div>
<div class="slider">
  <div class="slider-title"><span>Ширина текста</span><span id="widthVal">800</span></div>
  <input id="width" type="range" min="300" max="1100" value="800">
</div>
</details>

<div class="buttons">
  <button id="create">✍️ Создать</button>
  <button id="save">💾 Сохранить PNG</button>
</div>

<div class="paper-wrap">
  <img id="paperImage" src="./tetrad6.jpg" alt="Тетрадь">
  <canvas id="canvas" width="1240" height="1754"></canvas>
</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");
const paperImage=document.getElementById("paperImage");
const textInput=document.getElementById("text");
const style=document.getElementById("style");
const inkColor=document.getElementById("inkColor");
const alignment=document.getElementById("alignment");

const size=document.getElementById("size");
const line=document.getElementById("line");
const slant=document.getElementById("slant");
const jitter=document.getElementById("jitter");
const word=document.getElementById("word");
const ink=document.getElementById("ink");
const topPos=document.getElementById("top");
const leftPos=document.getElementById("left");
const xPos=document.getElementById("x");
const yPos=document.getElementById("y");
const textWidth=document.getElementById("width");

const controls=[
  size,line,slant,jitter,word,ink,
  topPos,leftPos,xPos,yPos,textWidth
];

/*
 * Калибровка фоновых тетрадей.
 * tetrad6: cell 36 — предварительная оценка по скриншоту.
 * Остальные значения ориентировочные; их нужно проверить по оригиналам.
 */
const paperSettings={
  tetrad1:{region:{x:105,y:145,w:1060,h:1530},cell:31},
  tetrad2:{region:{x:55,y:75,w:1120,h:1600},cell:30},
  tetrad3:{region:{x:100,y:110,w:1040,h:1510},cell:32},
  tetrad4:{region:{x:100,y:110,w:1040,h:1510},cell:31},
  tetrad5:{region:{x:100,y:110,w:1040,h:1510},cell:30},
  tetrad6:{region:{x:100,y:110,w:1040,h:1510},cell:36}
};

function getSettings(){
  return paperSettings[paper.value]||paperSettings.tetrad6;
}

function updateValues(){
  const ids={
    sizeVal:size,
    lineVal:line,
    slantVal:slant,
    jitterVal:jitter,
    wordVal:word,
    inkVal:ink,
    topVal:topPos,
    leftVal:leftPos,
    xVal:xPos,
    yVal:yPos,
    widthVal:textWidth
  };

  for(const [id,el] of Object.entries(ids)){
    document.getElementById(id).textContent=el.value;
  }
}

function getInkRGB(){
  if(inkColor.value==="darkblue")return "20,39,91";
  if(inkColor.value==="black")return "30,29,32";
  return "24,48,112";
}

function getPaperImage(){
  return `./${paper.value}.jpg`;
}

async function waitForSelectedFont(){
  try{
    await document.fonts.load(`${Number(size.value)}px "${style.value}"`);
  }catch(error){
    console.warn("Не удалось загрузить шрифт:",error);
  }
}

/* Разделяет предложения, сохраняя знаки препинания. */
function splitSentences(text){
  return text.match(/[^.!?…]+(?:[.!?…]+["'»”)]*)?|[.!?…]+/gu)
    ?.map(s=>s.trim()).filter(Boolean)||[];
}

function createText(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const content=textInput.value;
  if(!content.trim())return;

  const settings=getSettings();
  const region=settings.region;
  const fontSize=Number(size.value);

  const startX=Math.max(
    region.x,
    Math.min(
      region.x+region.w-1,
      region.x+Number(leftPos.value)+Number(xPos.value)
    )
  );

  let y=region.y+fontSize+Number(topPos.value)+Number(yPos.value);

  const maxWidth=Math.max(
    1,
    Math.min(
      Number(textWidth.value),
      region.x+region.w-startX,
      region.w
    )
  );

  /*
   * Между базовыми линиями соседних строк — одна высота клетки.
   * Это возвращает обычный шаг, без чрезмерного разрежения.
   * Ползунок позволяет немного менять расстояние.
   */
  const lineHeight=settings.cell*Number(line.value);

  ctx.font=`${fontSize}px "${style.value}"`;
  if("fontKerning" in ctx)ctx.fontKerning="normal";
  ctx.textBaseline="alphabetic";

  const paragraphs=content.replace(/\r\n/g,"\n").split("\n");
  const spaceWidth=ctx.measureText(" ").width*Number(word.value);

  for(let p=0;p<paragraphs.length;p++){
    const paragraph=paragraphs[p].trim();

    if(!paragraph){
      y+=lineHeight;
      continue;
    }

    const sentences=splitSentences(paragraph);

    /*
     * Предложения идут непрерывно, как обычный текст.
     * Перенос выполняется только тогда, когда строка не помещается.
     */
    const words=sentences.join(" ").split(/\s+/);
    let currentWords=[];
    let currentWidth=0;

    for(const currentWord of words){
      const wordWidth=ctx.measureText(currentWord).width;
      const proposed=currentWords.length===0
        ?wordWidth
        :currentWidth+spaceWidth+wordWidth;

      if(currentWords.length>0&&proposed>maxWidth){
        drawLine(currentWords,startX,y,spaceWidth,maxWidth);
        y+=lineHeight;
        currentWords=[currentWord];
        currentWidth=wordWidth;
      }else{
        currentWords.push(currentWord);
        currentWidth=proposed;
      }
    }

    if(currentWords.length){
      drawLine(currentWords,startX,y,spaceWidth,maxWidth);
      y+=lineHeight;
    }

    /* Сохраняем ручные переносы строк из текстового поля. */
    if(p<paragraphs.length-1)y+=lineHeight;
  }
}

/* Индивидуальная неровность каждой буквы. */
function drawLine(words,x,y,spaceWidth,maxWidth){
  const fontSize=Number(size.value);
  const amount=Number(jitter.value);
  const baseSlant=Number(slant.value);

  ctx.font=`${fontSize}px "${style.value}"`;
  if("fontKerning" in ctx)ctx.fontKerning="normal";
  ctx.textBaseline="alphabetic";

  const prepared=words.map(wordText=>{
    const chars=Array.from(wordText);
    const widths=chars.map(ch=>ctx.measureText(ch).width);

    return{
      chars,
      widths,
      width:widths.reduce((a,b)=>a+b,0)
    };
  });

  const totalWidth=prepared.reduce((a,item)=>a+item.width,0)
    +spaceWidth*Math.max(0,prepared.length-1);

  let cursorX=x;

  if(alignment.value==="center"){
    cursorX+=Math.max(0,(maxWidth-totalWidth)/2);
  }else if(alignment.value==="right"){
    cursorX+=Math.max(0,maxWidth-totalWidth);
  }

  const rgb=getInkRGB();
  const baseOpacity=Number(ink.value)/100;

  for(let w=0;w<prepared.length;w++){
    const item=prepared[w];

    for(let i=0;i<item.chars.length;i++){
      const ch=item.chars[i];
      const charWidth=item.widths[i];

      const verticalShift=(Math.random()-.5)*amount*.7;
      const angle=(Math.random()-.5)*amount*.006;
      const scaleX=1+(Math.random()-.5)*amount*.008;
      const scaleY=1+(Math.random()-.5)*amount*.012;
      const individualSlant=baseSlant+(Math.random()-.5)*amount*.8;

      const opacity=Math.max(
        .55,
        Math.min(1,baseOpacity+(Math.random()-.5)*amount*.004)
      );

      ctx.save();
      ctx.translate(cursorX,y+verticalShift);
      ctx.rotate(angle);
      ctx.transform(
        1,0,
        Math.tan(individualSlant*Math.PI/180),
        1,0,0
      );
      ctx.scale(scaleX,scaleY);

      ctx.fillStyle=`rgba(${rgb},${opacity})`;
      ctx.shadowColor=`rgba(${rgb},0.18)`;
      ctx.shadowBlur=.25;
      ctx.fillText(ch,0,0);
      ctx.restore();

      cursorX+=charWidth;
    }

    if(w<prepared.length-1)cursorX+=spaceWidth;
  }
}

paper.addEventListener("change",()=>{
  paperImage.src=getPaperImage();
  if(paperImage.complete&&paperImage.naturalWidth){
    createText();
  }
});

paperImage.addEventListener("load",createText);

paperImage.addEventListener("error",()=>{
  console.error("Не удалось загрузить фон:",getPaperImage());
});

textInput.addEventListener("input",createText);

style.addEventListener("change",async()=>{
  await waitForSelectedFont();
  createText();
});

inkColor.addEventListener("change",createText);
alignment.addEventListener("change",createText);

controls.forEach(el=>el.addEventListener("input",()=>{
  updateValues();
  createText();
}));

document.getElementById("create").addEventListener("click",async()=>{
  await waitForSelectedFont();
  createText();
});

document.getElementById("save").addEventListener("click",async()=>{
  await waitForSelectedFont();
  createText();

  if(!paperImage.complete||!paperImage.naturalWidth){
    alert("Подожди, пока загрузится изображение тетради.");
    return;
  }

  const result=document.createElement("canvas");
  result.width=canvas.width;
  result.height=canvas.height;

  const rctx=result.getContext("2d");
  rctx.drawImage(paperImage,0,0,result.width,result.height);

  rctx.globalCompositeOperation="multiply";
  rctx.drawImage(canvas,0,0);
  rctx.globalCompositeOperation="source-over";

  const link=document.createElement("a");
  link.download="handwrite-a4.png";
  link.href=result.toDataURL("image/png");
  link.click();
});

updateValues();
paperImage.src=getPaperImage();
document.fonts.ready.then(createText);
</script>
</body>
</html>
