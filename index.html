<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Neucha&family=Pangolin&family=Marck+Script&family=Bad+Script&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:160px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){

    .controls{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введи или вставь сюда текст..."></textarea>

<div class="controls">

<label>
Стиль почерка

<select id="style">

<option value="marck">Рукописный — Marck Script</option>
<option value="caveat">Рукописный — Caveat</option>
<option value="badscript">Небрежный — Bad Script</option>
<option value="kalam">Живой — Kalam</option>
<option value="neucha">Аккуратный — Neucha</option>
<option value="pangolin">Детский — Pangolin</option>

</select>
</label>


<label>
Бумага

<select id="paper">

<option value="plain">Чистая</option>
<option value="tetrad1">Тетрадь — левая поля</option>
<option value="tetrad2">Тетрадь — правая поля</option>

</select>

</label>


<div class="option">

<label>
Размер: <span id="sizeValue">30</span> px
</label>

<input
id="size"
type="range"
min="16"
max="60"
value="30"
>

</div>


<div class="option">

<label>
Интервал: <span id="lineValue">1.4</span>
</label>

<input
id="line"
type="range"
min="1"
max="2"
step="0.1"
value="1.4"
>

</div>


<div class="option">

<label>
Сдвиг текста вправо:
<span id="xOffsetValue">0</span> px
</label>

<input
id="xOffset"
type="range"
min="-100"
max="300"
value="0"
>

</div>


<div class="option">

<label>
Верхний отступ:
<span id="topValue">0</span> px
</label>

<input
id="top"
type="range"
min="-50"
max="150"
value="0"
>

</div>


<div class="option">

<label>
Ширина текста:
<span id="widthValue">800</span> px
</label>

<input
id="width"
type="range"
min="300"
max="1000"
value="800"
>

</div>

</div>


<div class="option" style="margin-top:10px;">

<label>
Разброс букв:
<span id="randomValue">1.2</span>
</label>

<input
id="random"
type="range"
min="0"
max="3"
step="0.1"
value="1.2"
>

</div>


<button id="create">
Создать лист
</button>

<button id="save">
Сохранить PNG
</button>


<div class="preview">

<canvas
id="canvas"
width="1240"
height="1754">
</canvas>

</div>

</div>
</div>


<script>


const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const text =
document.getElementById("text");

const paper =
document.getElementById("paper");

const style =
document.getElementById("style");

const size =
document.getElementById("size");

const line =
document.getElementById("line");

const xOffset =
document.getElementById("xOffset");

const topOffset =
document.getElementById("top");

const width =
document.getElementById("width");

const random =
document.getElementById("random");



function updateValues(){

    document.getElementById("sizeValue")
    .textContent =
    size.value;

    document.getElementById("lineValue")
    .textContent =
    line.value;

    document.getElementById("xOffsetValue")
    .textContent =
    xOffset.value;

    document.getElementById("topValue")
    .textContent =
    topOffset.value;

    document.getElementById("widthValue")
    .textContent =
    width.value;

    document.getElementById("randomValue")
    .textContent =
    random.value;

}



/* Фотографии тетради */

function getImageSrc(){

    if(paper.value === "tetrad1"){
        return "tetrad1.jpg";
    }

    if(paper.value === "tetrad2"){
        return "tetrad2.jpg";
    }

    return "";

}



/*
    ВАЖНО:

    Здесь находятся границы НАСТОЯЩЕГО ЛИСТА
    внутри фотографии.

    Значения указаны в процентах от фотографии.
*/


function getPageArea(){

    if(paper.value === "tetrad1"){

        return {

            left:0.105,
            right:0.965,

            top:0.115,
            bottom:0.895

        };

    }


    if(paper.value === "tetrad2"){

        return {

            left:0.025,
            right:0.965,

            top:0.115,
            bottom:0.895

        };

    }


    return {

        left:0,
        right:1,

        top:0,
        bottom:1

    };

}



/*
    Рисуем фотографию.
*/

function drawPaper(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(paper.value === "plain"){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const src =
    getImageSrc();


    const img =
    new Image();


    img.onload = function(){

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

    };


    img.onerror = function(){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

    };


    img.src = src;

}



/*
    Шрифт.
*/

function getFont(){

    if(style.value === "marck")
        return "Marck Script";

    if(style.value === "caveat")
        return "Caveat";

    if(style.value === "badscript")
        return "Bad Script";

    if(style.value === "kalam")
        return "Kalam";

    if(style.value === "neucha")
        return "Neucha";

    if(style.value === "pangolin")
        return "Pangolin";

    return "Marck Script";

}



/*
    Небольшая случайность
    делает буквы менее одинаковыми.
*/

function randomSmall(min,max){

    return Math.random() *
    (max-min) + min;

}



/*
    Получаем строки.

    ВАЖНО:
    пробелы в начале строки НЕ удаляются.
*/

function wrapText(str,maxWidth){

    const result = [];

    let current = "";

    for(let i=0;i<str.length;i++){

        const character =
        str[i];

        const test =
        current + character;


        if(
            ctx.measureText(test).width >
            maxWidth
            &&
            current.trim() !== ""
        ){

            result.push(current);

            current =
            character;

        }else{

            current =
            test;

        }

    }


    if(current !== ""){

        result.push(current);

    }


    return result;

}



/*
    Создание текста.
*/

function createText(){

    const fontSize =
    Number(size.value);

    const spacing =
    Number(line.value);

    const xShift =
    Number(xOffset.value);

    const topShift =
    Number(topOffset.value);

    const maxW =
    Number(width.value);

    const randomAmount =
    Number(random.value);


    ctx.font =
    fontSize +
    "px " +
    getFont() +
    ", cursive";


    ctx.fillStyle =
    "#17439d";


    ctx.textBaseline =
    "alphabetic";


    /*
        Определяем настоящий лист
        на фотографии.
    */

    const page =
    getPageArea();


    const pageLeft =
    canvas.width *
    page.left;

    const pageRight =
    canvas.width *
    page.right;

    const pageTop =
    canvas.height *
    page.top;

    const pageBottom =
    canvas.height *
    page.bottom;


    /*
        Начало текста.
    */

    let x =
    pageLeft +
    xShift;


    let y =
    pageTop +
    topShift +
    fontSize;


    /*
        Максимальная ширина
        не может выйти за лист.
    */

    const availableWidth =
    Math.min(
        maxW,
        pageRight - x
    );


    const paragraphs =
    text.value
    .replace(/\r/g,"")
    .split("\n");


    ctx.save();


    /*
        Обрезаем всё,
        что выходит за лист.
    */

    ctx.beginPath();

    ctx.rect(
        pageLeft,
        pageTop,
        pageRight-pageLeft,
        pageBottom-pageTop
    );

    ctx.clip();


    for(
        const paragraph
        of paragraphs
    ){

        if(!paragraph.length){

            y +=
            fontSize * spacing;

            continue;

        }


        const lines =
        wrapText(
            paragraph,
            availableWidth
        );


        for(
            const currentLine
            of lines
        ){

            if(
                y >
                pageBottom
            ){

                break;

            }


            /*
                Считаем пробелы
                в начале строки.

                Поэтому если написать:

                "          06.11"

                число реально
                сдвинется вправо.
            */

            const leadingSpaces =
            currentLine.match(/^ */)[0].length;


            const spaceWidth =
            ctx.measureText(" ").width;


            let currentX =
            pageLeft +
            xShift +
            leadingSpaces *
            spaceWidth;


            /*
                Пишем букву за буквой.
            */

            for(
                let i =
                leadingSpaces;

                i <
                currentLine.length;

                i++
            ){

                const character =
                currentLine[i];


                /*
                    Небольшой случайный
                    наклон буквы.
                */

                const rotation =
                randomSmall(
                    -0.025,
                    0.025
                );


                const yMove =
                randomSmall(
                    -randomAmount,
                    randomAmount
                );


                ctx.save();


                ctx.translate(
                    currentX,
                    y + yMove
                );


                ctx.rotate(
                    rotation
                );


                ctx.fillText(
                    character,
                    0,
                    0
                );


                ctx.restore();


                currentX +=
                ctx.measureText(character).width
                +
                randomSmall(
                    -0.35,
                    0.45
                );

            }


            y +=
            fontSize *
            spacing;

        }

    }


    ctx.restore();

}



/*
    Создать.
*/

document
.getElementById("create")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();

    }
);



/*
    Сохранение PNG.
*/

document
.getElementById("save")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();


        setTimeout(
            function(){

                const link =
                document.createElement("a");


                link.download =
                "HandWrite-A4.png";


                link.href =
                canvas.toDataURL(
                    "image/png"
                );


                link.click();

            },
            300
        );

    }
);



/*
    Автоматическое обновление.
*/

[
    paper,
    style,
    size,
    line,
    xOffset,
    topOffset,
    width,
    random
]

.forEach(
    function(element){

        element.addEventListener(
            "input",
            function(){

                updateValues();

                drawPaper();

            }
        );


        element.addEventListener(
            "change",
            function(){

                updateValues();

                drawPaper();

            }
        );

    }
);



/*
    Ввод текста тоже сразу
    обновляет результат.
*/

text.addEventListener(
    "input",
    function(){

        drawPaper();

    }
);



updateValues();


document.fonts.ready.then(
    function(){

        drawPaper();

    }
);


</script>

</body>
</html>
