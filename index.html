
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HandWrite A4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&family=Shantell+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Pecita";
  src: url("./Pecita.ttf") format("truetype");
  font-display: swap;
}
@font-face {
  font-family: "Segoe Script Local";
  src: url("./Segoe_Script.ttf") format("truetype");
  font-display: swap;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: #eee;
  font-family: Arial, sans-serif;
  color: #222;
}

h1 {
  text-align: center;
  margin: 5px 0 18px;
  font-size: 24px;
}

.panel {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 14px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0002;
}

.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.control {
  flex: 1;
  min-width: 170px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
  font-weight: bold;
}

select, input[type=range] { width: 100%; }

select {
  height: 37px;
  border: 1px solid #ccc;
  border-radius: 7px;
  padding: 4px 8px;
  background: white;
}

textarea {
  width: 100%;
  min-height: 140px;
  margin-top: 12px;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  resize: vertical;
  font-size: 16px;
}

details {
  margin-top: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 8px 10px;
}

summary {
  cursor: pointer;
  font-weight: bold;
  padding: 4px;
}

.slider { margin: 11px 0; }

.slider-title {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 14px;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 12px;
  font-size: 16px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:hover { opacity: .85; }

.paper-wrap {
  position: relative;
  width: min(100%, 620px);
  margin: 25px auto 0;
  line-height: 0;
  box-shadow: 0 4px 18px #0003;
  background: white;
}

#paperImage {
  display: block;
  width: 100%;
  height: auto;
}

#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

@media(max-width:500px) {
  body { padding: 7px; }
  .panel { padding: 10px; }
  .control { min-width: 135px; }
  .buttons button { font-size: 14px; padding: 11px 5px; }
}
</style>
</head>

<body>
<div class="panel">
<h1>✍️ HandWrite A4</h1>

<div class="row">
  <div class="control">
    <label for="style">Стиль почерка</label>
    <select id="style">
      <option value="Segoe Script Local" selected>Segoe Script — русский и украинский</option>
      <option value="Pecita">Pecita — курсив</option>
      <option value="Shantell Sans">Shantell Sans</option>
      <option value="Bad Script">Bad Script</option>
      <option value="Caveat">Caveat</option>
      <option value="Kalam">Kalam</option>
      <option value="Marck Script">Marck Script</option>
      <option value="Neucha">Neucha</option>
      <option value="Pangolin">Pangolin</option>
    </select>
  </div>

  <div class="control">
    <label for="paper">Бумага</label>
    <select id="paper">
      <option value="tetrad1">Тетрадь 1</option>
      <option value="tetrad2">Тетрадь 2</option>
      <option value="tetrad3">Тетрадь 3</option>
      <option value="tetrad4">Тетрадь 4</option>
      <option value="tetrad5">Тетрадь 5</option>
      <option value="tetrad6" selected>Тетрадь 6</option>
    </select>
  </div>

  <div class="control">
    <label for="inkColor">Цвет ручки</label>
    <select id="inkColor">
      <option value="blue" selected>Синий</option>
      <option value="darkblue">Тёмно-синий</option>
      <option value="black">Чёрный</option>
    </select>
  </div>

  <div class="control">
    <label for="alignment">Выравнивание</label>
    <select id="alignment">
      <option value="left" selected>Слева</option>
      <option value="center">По центру</option>
      <option value="right">Справа</option>
    </select>
  </div>
</div>

<textarea id="text" placeholder="Введите текст здесь..."></textarea>

<details open>
  <summary>✏️ Размер текста</summary>
  <div class="slider">
    <div class="slider-title"><span>Размер</span><span id="sizeVal">30</span></div>
    <input id="size" type="range" min="16" max="60" value="30">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Межстрочный интервал</span><span id="lineVal">1.4</span></div>
    <input id="line" type="range" min="1" max="2" step="0.1" value="1.4">
  </div>
</details>

<details>
  <summary>🖊️ Реалистичность почерка</summary>
  <div class="slider">
    <div class="slider-title"><span>Кривизна букв</span><span id="curveVal">3</span></div>
    <input id="curve" type="range" min="0" max="10" step="1" value="3">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Общий наклон</span><span id="slantVal">0</span></div>
    <input id="slant" type="range" min="-8" max="8" value="0">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Неровность строки</span><span id="jitterVal">2</span></div>
    <input id="jitter" type="range" min="0" max="6" step="0.5" value="2">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Расстояние между словами</span><span id="wordVal">1</span></div>
    <input id="word" type="range" min="0.5" max="2" step="0.1" value="1">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Прозрачность чернил</span><span id="inkVal">92</span></div>
    <input id="ink" type="range" min="60" max="100" value="92">
  </div>
</details>

<details>
  <summary>📐 Положение текста</summary>
  <div class="slider">
    <div class="slider-title"><span>Отступ сверху</span><span id="topVal">0</span></div>
    <input id="top" type="range" min="0" max="300" value="0">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Отступ слева</span><span id="leftVal">0</span></div>
    <input id="left" type="range" min="0" max="300" value="0">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Смещение X</span><span id="xVal">0</span></div>
    <input id="x" type="range" min="-300" max="300" value="0">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Смещение Y</span><span id="yVal">0</span></div>
    <input id="y" type="range" min="-300" max="300" value="0">
  </div>
  <div class="slider">
    <div class="slider-title"><span>Ширина текста</span><span id="widthVal">800</span></div>
    <input id="width" type="range" min="300" max="1100" value="800">
  </div>
</details>

<div class="buttons">
  <button id="create">✍️ Создать</button>
  <button id="save">💾 Сохранить PNG</button>
</div>

<div class="paper-wrap">
  <img id="paperImage" src="./tetrad6.jpg" alt="Тетрадь">
  <canvas id="canvas" width="1240" height="1754"></canvas>
</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const paper = document.getElementById("paper");
const paperImage = document.getElementById("paperImage");
const textInput = document.getElementById("text");
const style = document.getElementById("style");
const inkColor = document.getElementById("inkColor");
const alignment = document.getElementById("alignment");

const size = document.getElementById("size");
const line = document.getElementById("line");
const curve = document.getElementById("curve");
const slant = document.getElementById("slant");
const jitter = document.getElementById("jitter");
const word = document.getElementById("word");
const ink = document.getElementById("ink");

const topPos = document.getElementById("top");
const leftPos = document.getElementById("left");
const xPos = document.getElementById("x");
const yPos = document.getElementById("y");
const textWidth = document.getElementById("width");

const controls = [
  size, line, curve, slant, jitter, word, ink,
  topPos, leftPos, xPos, yPos, textWidth
];

function getPaperRegion() {
  const regions = {
    tetrad1: {x:105, y:145, w:1060, h:1530},
    tetrad2: {x:55, y:75, w:1120, h:1600},
    tetrad3: {x:100, y:110, w:1040, h:1510},
    tetrad4: {x:100, y:110, w:1040, h:1510},
    tetrad5: {x:100, y:110, w:1040, h:1510},
    tetrad6: {x:100, y:110, w:1040, h:1510}
  };
  return regions[paper.value] || regions.tetrad1;
}

function updateValues() {
  const ids = {
    sizeVal:size,
    lineVal:line,
    curveVal:curve,
    slantVal:slant,
    jitterVal:jitter,
    wordVal:word,
    inkVal:ink,
    topVal:topPos,
    leftVal:leftPos,
    xVal:xPos,
    yVal:yPos,
    widthVal:textWidth
  };

  for (const [id, el] of Object.entries(ids)) {
    document.getElementById(id).textContent = el.value;
  }
}

function getInkRGB() {
  if (inkColor.value === "darkblue") return "14,42,105";
  if (inkColor.value === "black") return "25,25,25";
  return "25,65,145";
}

function getPaperImage() {
  return `./${paper.value}.jpg`;
}

paper.addEventListener("change", () => {
  paperImage.src = getPaperImage();
  createText();
});

async function waitForSelectedFont() {
  const name = style.value;
  try {
    await document.fonts.load(`${Number(size.value)}px "${name}"`);
    await document.fonts.ready;
  } catch (e) {
    console.warn("Не удалось загрузить шрифт:", name, e);
  }
}

function prepareFont() {
  ctx.font = `${Number(size.value)}px "${style.value}"`;
  ctx.textBaseline = "alphabetic";
  if ("fontKerning" in ctx) ctx.fontKerning = "normal";
}

function randomBetween(amount) {
  return (Math.random() - 0.5) * 2 * amount;
}

function createText() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!textInput.value.trim()) return;

  prepareFont();

  const region = getPaperRegion();
  const fontSize = Number(size.value);
  const startX = Math.max(
    region.x,
    Math.min(
      region.x + region.w,
      region.x + Number(leftPos.value) + Number(xPos.value)
    )
  );

  let y = region.y + fontSize +
    Number(topPos.value) + Number(yPos.value);

  const maxWidth = Math.max(
    1,
    Math.min(
      Number(textWidth.value),
      region.x + region.w - startX,
      region.w
    )
  );

  const lineHeight = fontSize * Number(line.value);
  const paragraphs = textInput.value.replace(/\r/g, "").split("\n");

  ctx.fillStyle = `rgba(${getInkRGB()},${Number(ink.value)/100})`;

  for (const paragraph of paragraphs) {
    if (!paragraph.trim()) {
      y += lineHeight;
      continue;
    }

    const words = paragraph.trim().split(/\s+/);
    const spaceWidth = ctx.measureText(" ").width * Number(word.value);
    let lineWords = [];
    let usedWidth = 0;

    for (const currentWord of words) {
      const wordWidth = ctx.measureText(currentWord).width;
      const proposed = lineWords.length
        ? usedWidth + spaceWidth + wordWidth
        : wordWidth;

      if (lineWords.length && proposed > maxWidth) {
        drawLine(lineWords, startX, y, spaceWidth, maxWidth);
        y += lineHeight;
        lineWords = [currentWord];
        usedWidth = wordWidth;
      } else {
        lineWords.push(currentWord);
        usedWidth = proposed;
      }
    }

    if (lineWords.length) {
      drawLine(lineWords, startX, y, spaceWidth, maxWidth);
      y += lineHeight;
    }

    if (y > canvas.height) break;
  }
}

function drawLine(words, x, y, spaceWidth, maxWidth) {
  prepareFont();

  const widths = words.map(w => ctx.measureText(w).width);
  const totalWidth = widths.reduce((a,b) => a+b, 0) +
    spaceWidth * Math.max(0, words.length - 1);

  let currentX = x;
  if (alignment.value === "center") {
    currentX += Math.max(0, (maxWidth-totalWidth)/2);
  } else if (alignment.value === "right") {
    currentX += Math.max(0, maxWidth-totalWidth);
  }

  const curveAmount = Number(curve.value);
  const lineJitter = Number(jitter.value);
  const generalSlant = Number(slant.value) * Math.PI / 180;

  for (let i = 0; i < words.length; i++) {
    const wordText = words[i];

    /*
      При нулевой кривизне слово рисуется целиком,
      сохраняя соединения букв шрифта.
      При увеличении кривизны буквы слегка меняют
      наклон, высоту и положение.
    */
    if (curveAmount === 0) {
      ctx.save();
      ctx.translate(
        currentX + randomBetween(lineJitter * 0.25),
        y + randomBetween(lineJitter * 0.35)
      );
      if (generalSlant) {
        ctx.transform(1, 0, Math.tan(generalSlant), 1, 0, 0);
      }
      ctx.fillText(wordText, 0, 0);
      ctx.restore();
    } else {
      let letterX = currentX;

      // Array.from корректно обрабатывает большинство
      // букв Unicode, включая украинские символы.
      const letters = Array.from(wordText);

      for (const letter of letters) {
        const letterWidth = ctx.measureText(letter).width;
        const strength = curveAmount / 10;

        const dx = randomBetween(strength * 1.1);
        const dy = randomBetween(strength * 2.4);
        const rotation = randomBetween(strength * 0.075);
        const scaleX = 1 + randomBetween(strength * 0.10);
        const scaleY = 1 + randomBetween(strength * 0.07);

        ctx.save();
        ctx.translate(
          letterX + dx,
          y + dy + randomBetween(lineJitter * 0.2)
        );
        ctx.rotate(generalSlant + rotation);
        ctx.scale(scaleX, scaleY);
        ctx.fillText(letter, 0, 0);
        ctx.restore();

        // Небольшой дополнительный шаг между буквами
        // помогает регулировать естественность письма.
        letterX += letterWidth + randomBetween(strength * 0.65);
      }
    }

    currentX += widths[i];
    if (i < words.length - 1) currentX += spaceWidth;
  }
}

textInput.addEventListener("input", createText);

style.addEventListener("change", async () => {
  await waitForSelectedFont();
  createText();
});

inkColor.addEventListener("change", createText);
alignment.addEventListener("change", createText);

controls.forEach(el => {
  el.addEventListener("input", () => {
    updateValues();
    createText();
  });
});

document.getElementById("create").addEventListener("click", async () => {
  await waitForSelectedFont();
  createText();
});

document.getElementById("save").addEventListener("click", async () => {
  await waitForSelectedFont();
  createText();

  if (!paperImage.complete || !paperImage.naturalWidth) {
    alert("Подожди, пока загрузится изображение тетради.");
    return;
  }

  const result = document.createElement("canvas");
  result.width = canvas.width;
  result.height = canvas.height;

  const rctx = result.getContext("2d");
  rctx.drawImage(paperImage, 0, 0, result.width, result.height);
  rctx.drawImage(canvas, 0, 0);

  const link = document.createElement("a");
  link.download = "handwrite-a4.png";
  link.href = result.toDataURL("image/png");
  link.click();
});

paperImage.addEventListener("load", createText);
paperImage.addEventListener("error", () => {
  console.error("Не удалось загрузить фон:", getPaperImage());
});

updateValues();
paperImage.src = getPaperImage();

document.fonts.ready.then(createText);
waitForSelectedFont().then(createText);
</script>
</body>
</html>
