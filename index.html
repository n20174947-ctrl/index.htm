<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✍️ HandWrite A4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fontlibrary.org//face/pecita">

<style>
@font-face {
  font-family: "Victor Handwriting";
  src: url("./victor-handwriting.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 10px;
  background: #e9e6df;
  color: #292929;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 900px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 23px;
  margin: 4px 0 12px;
}

.panel {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000010;
}

textarea {
  width: 100%;
  min-height: 125px;
  resize: vertical;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font: 16px/1.5 Arial, sans-serif;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 12px;
}

.control { min-width: 0; }

.control label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  margin-bottom: 3px;
  font-size: 12px;
}

.control label span {
  font-weight: bold;
  white-space: nowrap;
}

select {
  width: 100%;
  height: 34px;
  padding: 4px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 13px;
}

input[type="range"] {
  display: block;
  width: 100%;
  height: 23px;
  margin: 2px 0;
  accent-color: #394354;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

button {
  flex: 1;
  min-width: 0;
  padding: 12px 6px;
  border: 0;
  border-radius: 8px;
  background: #343d4d;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #e6e7e9;
  color: #252525;
}

.preview-title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin: 0 0 8px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid #ddd;
  background: white;
}

.status {
  font-size: 11px;
  color: #777;
  margin-top: 6px;
  min-height: 14px;
}

@media (max-width: 480px) {
  body { padding: 7px; }
  .panel { padding: 9px; }
  h1 { font-size: 21px; }
  .controls { gap: 7px 9px; }
  button { font-size: 13px; }
}
</style>
</head>

<body>
<div class="app">
  <h1>✍️ HandWrite A4</h1>

  <section class="panel">
    <textarea id="text" placeholder="Введи или вставь текст сюда..."></textarea>
  </section>

  <section class="panel">
    <div class="controls">

      <div class="control">
        <label for="font">Шрифт</label>
        <select id="font">
          <option value="PecitaBook">Pecita</option>
          <option value="Victor Handwriting">Victor Handwriting</option>
          <option value="Bad Script">Bad Script</option>
          <option value="Caveat">Caveat</option>
          <option value="Kalam">Kalam</option>
          <option value="Marck Script">Marck Script</option>
          <option value="Neucha">Neucha</option>
          <option value="Pangolin">Pangolin</option>
        </select>
      </div>

      <div class="control">
        <label for="paper">Бумага</label>
        <select id="paper">
          <option value="plain">Белый лист</option>
          <option value="tetrad1">Тетрадь 1</option>
          <option value="tetrad2">Тетрадь 2</option>
          <option value="tetrad3">Тетрадь 3</option>
          <option value="tetrad4">Тетрадь 4</option>
          <option value="tetrad5">Тетрадь 5</option>
          <option value="tetrad6">Тетрадь 6</option>
        </select>
      </div>

      <div class="control">
        <label for="size">Размер <span id="sizeVal">30</span></label>
        <input id="size" type="range" min="16" max="60" value="30">
      </div>

      <div class="control">
        <label for="line">Интервал <span id="lineVal">1.4</span></label>
        <input id="line" type="range" min="1" max="2.2" step="0.05" value="1.4">
      </div>

      <div class="control">
        <label for="slant">Наклон <span id="slantVal">0</span></label>
        <input id="slant" type="range" min="-8" max="8" value="0">
      </div>

      <div class="control">
        <label for="jitter">Неровность <span id="jitterVal">2</span></label>
        <input id="jitter" type="range" min="0" max="6" step="0.5" value="2">
      </div>

      <div class="control">
        <label for="wordSpace">Расстояние слов <span id="wordSpaceVal">1</span></label>
        <input id="wordSpace" type="range" min="0.7" max="1.5" step="0.05" value="1">
      </div>

      <div class="control">
        <label for="opacity">Чернила <span id="opacityVal">92%</span></label>
        <input id="opacity" type="range" min="60" max="100" value="92">
      </div>

      <div class="control">
        <label for="top">Сверху <span id="topVal">70</span></label>
        <input id="top" type="range" min="20" max="250" value="70">
      </div>

      <div class="control">
        <label for="left">Слева <span id="leftVal">80</span></label>
        <input id="left" type="range" min="20" max="250" value="80">
      </div>

      <div class="control">
        <label for="shift">Сдвиг X <span id="shiftVal">0</span></label>
        <input id="shift" type="range" min="-250" max="250" value="0">
      </div>

      <div class="control">
        <label for="width">Ширина <span id="widthVal">1060</span></label>
        <input id="width" type="range" min="300" max="1120" step="10" value="1060">
      </div>

    </div>

    <div class="buttons">
      <button id="create">Создать лист</button>
      <button id="save" class="secondary">Сохранить PNG</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel">
    <div class="preview-title">Предпросмотр A4</div>
    <canvas id="canvas" width="1240" height="1754"></canvas>
  </section>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const textInput = document.getElementById("text");
const fontInput = document.getElementById("font");
const paperInput = document.getElementById("paper");
const statusEl = document.getElementById("status");

const images = {};

for (let i = 1; i <= 6; i++) {
  const img = new Image();
  img.onload = scheduleRender;
  img.src = `./tetrad${i}.jpg`;
  images[`tetrad${i}`] = img;
}

const fields = [
  ["size", "sizeVal"],
  ["line", "lineVal"],
  ["slant", "slantVal"],
  ["jitter", "jitterVal"],
  ["wordSpace", "wordSpaceVal"],
  ["opacity", "opacityVal"],
  ["top", "topVal"],
  ["left", "leftVal"],
  ["shift", "shiftVal"],
  ["width", "widthVal"]
];

fields.forEach(([id, outputId]) => {
  const input = document.getElementById(id);
  const output = document.getElementById(outputId);

  input.addEventListener("input", () => {
    let value = input.value;
    if (id === "opacity") value += "%";
    output.textContent = value;
    scheduleRender();
  });
});

function settings() {
  const get = id => Number(document.getElementById(id).value);

  return {
    font: fontInput.value,
    paper: paperInput.value,
    size: get("size"),
    line: get("line"),
    slant: get("slant"),
    jitter: get("jitter"),
    wordSpace: get("wordSpace"),
    opacity: get("opacity") / 100,
    top: get("top"),
    left: get("left"),
    shift: get("shift"),
    width: get("width")
  };
}

function setFont(s) {
  ctx.font = `${s.size}px "${s.font}"`;
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";

  // Поддерживается не каждым браузером, но безопасно при отсутствии.
  if ("fontKerning" in ctx) ctx.fontKerning = "normal";
}

function drawBackground(s) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (s.paper === "plain") return;

  const img = images[s.paper];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
}

function bounds(s) {
  let x = s.left;
  let y = s.top;
  let width = s.width;

  if (s.paper === "tetrad1") {
    x = Math.max(x, 105);
    y = Math.max(y, 145);
    width = Math.min(width, 1060);
  }

  if (s.paper === "tetrad2") {
    x = Math.max(x, 55);
    y = Math.max(y, 75);
    width = Math.min(width, 1120);
  }

  x += s.shift;
  x = Math.max(0, Math.min(x, canvas.width - 100));
  width = Math.max(100, Math.min(width, canvas.width - x - 20));

  return { x, y, width };
}

function wrapText(paragraph, maxWidth) {
  if (!paragraph.trim()) return [""];

  const words = paragraph.trim().split(/\s+/);
  const lines = [];
  let current = "";

  for (let word of words) {
    if (ctx.measureText(word).width > maxWidth) {
      if (current) {
        lines.push(current);
        current = "";
      }

      let part = "";
      for (const char of word) {
        const test = part + char;
        if (part && ctx.measureText(test).width > maxWidth) {
          lines.push(part);
          part = char;
        } else {
          part = test;
        }
      }
      current = part;
      continue;
    }

    const test = current ? current + " " + word : word;

    if (ctx.measureText(test).width <= maxWidth) {
      current = test;
    } else {
      if (current) lines.push(current);
      current = word;
    }
  }

  if (current) lines.push(current);
  return lines;
}

function drawLine(line, x, y, s) {
  if (!line) return;

  const words = line.split(" ");
  let cursor = x;

  ctx.save();
  ctx.globalAlpha = s.opacity;
  ctx.fillStyle = "#243a83";

  for (let i = 0; i < words.length; i++) {
    const word = words[i];

    if (!word) {
      cursor += s.size * 0.3;
      continue;
    }

    const randomX = (Math.random() - 0.5) * s.jitter * 0.5;
    const randomY = (Math.random() - 0.5) * s.jitter;

    ctx.save();
    ctx.translate(cursor + randomX, y + randomY);
    ctx.transform(1, 0, Math.tan(s.slant * Math.PI / 180), 1, 0, 0);

    // Целые слова позволяют шрифту сохранять внутренние соединения букв.
    ctx.fillText(word, 0, 0);
    ctx.restore();

    cursor += ctx.measureText(word).width * s.wordSpace;

    if (i < words.length - 1) {
      cursor += s.size * 0.32 * s.wordSpace;
    }
  }

  ctx.restore();
}

let renderTimer = null;
let renderVersion = 0;

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 100);
}

async function render() {
  const myVersion = ++renderVersion;
  const s = settings();

  // Ждём загрузки выбранного шрифта, чтобы не рисовать системным шрифтом.
  try {
    if (document.fonts) {
      await document.fonts.load(`${s.size}px "${s.font}"`);
    }
  } catch (e) {
    // Если внешний шрифт недоступен, браузер может использовать замену.
  }

  if (myVersion !== renderVersion) return;

  drawBackground(s);

  const text = textInput.value;
  if (!text.trim()) {
    statusEl.textContent = "";
    return;
  }

  const area = bounds(s);
  setFont(s);

  const lineHeight = s.size * s.line;
  const paragraphs = text.replace(/\r/g, "").split("\n");
  let y = area.y + s.size;

  for (const paragraph of paragraphs) {
    const lines = wrapText(paragraph, area.width);

    for (const line of lines) {
      if (y > canvas.height - 20) {
        statusEl.textContent = "Текст не поместился: уменьши размер или сократи текст.";
        return;
      }

      drawLine(line, area.x, y, s);
      y += lineHeight;
    }

    y += lineHeight * 0.25;
  }

  statusEl.textContent = "Предпросмотр обновлён";
}

// Обновление при наборе текста, вставке, выборе шрифта и смене фона.
textInput.addEventListener("input", scheduleRender);
fontInput.addEventListener("change", scheduleRender);
paperInput.addEventListener("change", scheduleRender);

document.getElementById("create").addEventListener("click", render);

document.getElementById("save").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "handwrite-a4.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

window.addEventListener("load", async () => {
  if (document.fonts) {
    await document.fonts.ready;
  }
  render();
});
</script>
</body>
</html>
