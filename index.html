<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HandWrite A4 — realistic handwriting</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px
}

textarea{
    width:100%;
    height:160px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold
}

select,input{
    width:100%;
    margin-top:6px
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white
}

#save{
    background:#ddd
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

.small{
    font-size:12px;
    color:#666;
    margin-top:5px;
    line-height:1.35;
}

@media(max-width:600px){
    .controls{
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введи или вставь сюда текст..."></textarea>

<div class="controls">

<label>
Стиль почерка
<select id="style">
<option value="badscript">Максимально рукописный — Bad Script</option>
<option value="caveat">Похожий на тетрадный — Caveat</option>
<option value="marck">Связный — Marck Script</option>
<option value="kalam">Живой — Kalam</option>
<option value="neucha">Аккуратный — Neucha</option>
<option value="pangolin">Неровный — Pangolin</option>
</select>
</label>

<label>
Бумага
<select id="paper">
<option value="plain">Чистая</option>
<option value="tetrad1">Тетрадь — левая поля</option>
<option value="tetrad2">Тетрадь — правая поля</option>
</select>
</label>

<div class="option">
<label>Размер: <span id="sizeValue">30</span> px</label>
<input id="size" type="range" min="16" max="60" value="30">
</div>

<div class="option">
<label>Интервал строк: <span id="lineValue">1.4</span></label>
<input id="line" type="range" min="1" max="2" step="0.05" value="1.4">
</div>

<div class="option">
<label>Наклон почерка: <span id="slantValue">0</span></label>
<input id="slant" type="range" min="-8" max="8" step="0.5" value="0">
</div>

<div class="option">
<label>Естественная неровность: <span id="jitterValue">2</span> px</label>
<input id="jitter" type="range" min="0" max="6" step="0.5" value="2">
</div>

<div class="option">
<label>Расстояние между словами: <span id="wordValue">1</span></label>
<input id="word" type="range" min="0.7" max="1.5" step="0.05" value="1">
</div>

<div class="option">
<label>Поля листа сверху: <span id="topValue">70</span> px</label>
<input id="top" type="range" min="0" max="300" value="70">
</div>

<div class="option">
<label>Отступ от реального края листа: <span id="leftValue">80</span> px</label>
<input id="left" type="range" min="0" max="300" value="80">
</div>

<div class="option">
<label>Смещение текста по X: <span id="xValue">0</span> px</label>
<input id="x" type="range" min="-250" max="250" value="0">

<div class="small">
Можно двигать весь текст вправо/влево.
</div>
</div>

<div class="option">
<label>Ширина области текста: <span id="widthValue">800</span> px</label>
<input id="width" type="range" min="300" max="1100" value="800">
</div>

<div class="option">
<label>Прозрачность чернил: <span id="inkValue">92</span>%</label>
<input id="ink" type="range" min="60" max="100" value="92">
</div>

</div>

<button id="create">Создать лист</button>
<button id="save">Сохранить PNG</button>

<div class="preview">
<canvas id="canvas" width="1240" height="1754"></canvas>
</div>

</div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const text=document.getElementById("text");
const paper=document.getElementById("paper");
const style=document.getElementById("style");

const size=document.getElementById("size");
const line=document.getElementById("line");
const slant=document.getElementById("slant");
const jitter=document.getElementById("jitter");
const word=document.getElementById("word");
const top=document.getElementById("top");
const left=document.getElementById("left");
const x=document.getElementById("x");
const width=document.getElementById("width");
const ink=document.getElementById("ink");


function val(id){
    return document.getElementById(id);
}


function updateValues(){

    val("sizeValue").textContent=size.value;
    val("lineValue").textContent=line.value;
    val("slantValue").textContent=slant.value;
    val("jitterValue").textContent=jitter.value;
    val("wordValue").textContent=word.value;
    val("topValue").textContent=top.value;
    val("leftValue").textContent=left.value;
    val("xValue").textContent=x.value;
    val("widthValue").textContent=width.value;
    val("inkValue").textContent=ink.value;

}


function getImageSrc(){

    if(paper.value==="tetrad1")
        return "tetrad1.jpg";

    if(paper.value==="tetrad2")
        return "tetrad2.jpg";

    return "";

}


function random(min,max){

    return Math.random()*(max-min)+min;

}


function getFont(){

    if(style.value==="badscript")
        return "Bad Script";

    if(style.value==="caveat")
        return "Caveat";

    if(style.value==="marck")
        return "Marck Script";

    if(style.value==="kalam")
        return "Kalam";

    if(style.value==="neucha")
        return "Neucha";

    if(style.value==="pangolin")
        return "Pangolin";

    return "Bad Script";

}


/*
====================================================
НАСТРОЙКА ШРИФТА
====================================================
*/

function prepareFont(){

    const s=Number(size.value);

    ctx.font=`${s}px "${getFont()}"`;

    try{

        ctx.fontKerning="normal";
        ctx.fontVariantLigatures="normal";
        ctx.fontStretch="normal";

    }catch(e){}

}


/*
====================================================
ПЕРЕНОС СТРОК
====================================================
*/

function wrapText(str,maxWidth){

    const words=str.trim().split(/\s+/);

    const result=[];

    let current="";


    for(const w of words){

        const test=current
            ? current+" "+w
            : w;


        if(
            ctx.measureText(test).width>maxWidth
            &&
            current
        ){

            result.push(current);

            current=w;

        }else{

            current=test;

        }

    }


    if(current)
        result.push(current);


    return result;

}


/*
====================================================
ОБЛАСТЬ ФОТОГРАФИИ ТЕТРАДИ
====================================================
*/

const paperRegion={

    tetrad1:{
        x:105,
        y:145,
        w:1060,
        h:1530
    },

    tetrad2:{
        x:55,
        y:75,
        w:1120,
        h:1600
    }

};


/*
====================================================
РИСОВАНИЕ БУМАГИ
====================================================
*/

function drawPaper(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(paper.value==="plain"){

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const src=getImageSrc();

    const img=new Image();


    img.onload=function(){

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const r=paperRegion[paper.value];


        ctx.save();

        ctx.beginPath();

        ctx.rect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.clip();


        const scale=Math.max(

            canvas.width/r.w,

            canvas.height/r.h

        );


        const dw=img.width*scale;

        const dh=img.height*scale;


        const dx=-r.x*scale;

        const dy=-r.y*scale;


        ctx.drawImage(
            img,
            dx,
            dy,
            dw,
            dh
        );


        ctx.restore();


        createText();

    };


    img.onerror=function(){

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

        console.log(
            "Не удалось загрузить:",
            src
        );

    };


    img.src=src+"?v="+Date.now();

}


/*
====================================================
РИСОВАНИЕ ОДНОГО СЛОВА
====================================================

ВАЖНО:

Слово рисуется ОДНИМ fillText.

Благодаря этому браузер сохраняет
связность букв конкретного шрифта.
*/


function drawWord(
    wordText,
    xPos,
    yPos,
    baseSize
){

    const j=Number(jitter.value);


    /*
    Небольшое случайное движение
    по вертикали.
    */

    const yMove=random(
        -j,
        j
    );


    /*
    Естественный небольшой наклон.
    */

    const angle=

        random(
            -0.012,
            0.012
        )

        +

        Number(slant.value)
        *
        Math.PI
        /
        180;


    ctx.save();


    ctx.translate(
        xPos,
        yPos+yMove
    );


    ctx.rotate(angle);


    /*
    Небольшая случайная ширина.
    */

    const sx=random(
        0.985,
        1.015
    );


    /*
    Небольшая случайная высота.
    */

    const sy=random(
        0.98,
        1.02
    );


    ctx.scale(
        sx,
        sy
    );


    ctx.fillText(
        wordText,
        0,
        0
    );


    ctx.restore();


    return ctx.measureText(
        wordText
    ).width*sx;

}


/*
====================================================
РИСОВАНИЕ СТРОКИ
====================================================
*/

function drawLine(
    lineText,
    xPos,
    yPos
){

    const wordScale=
        Number(word.value);


    const words=
        lineText.split(" ");


    let cursor=xPos;


    for(
        let i=0;
        i<words.length;
        i++
    ){

        const w=words[i];


        if(!w)
            continue;


        /*
        Измеряем слово ДО рисования.
        */

        const wordWidth=
            ctx.measureText(w).width;


        /*
        Рисуем слово целиком.
        */

        drawWord(
            w,
            cursor,
            yPos,
            Number(size.value)
        );


        /*
        Размер пробела.
        */

        const normalSpace=
            ctx.measureText(" ").width;


        /*
        Небольшая естественная
        вариация расстояния.
        */

        const natural=
            random(
                0.94,
                1.06
            );


        cursor +=

            wordWidth

            +

            normalSpace
            *
            wordScale
            *
            natural;

    }

}


/*
====================================================
ОСНОВНОЙ ГЕНЕРАТОР ТЕКСТА
====================================================
*/

function createText(){

    prepareFont();


    const fontSize=
        Number(size.value);


    const spacing=
        Number(line.value);


    const maxW=
        Number(width.value);


    /*
    Начальная позиция.
    */

    const startX=

        Number(left.value)

        +

        Number(x.value);


    let y=

        Number(top.value)

        +

        fontSize;


    const lineHeight=
        fontSize*spacing;


    const paragraphs=

        text.value
        .replace(/\r/g,"")
        .split("\n");


    /*
    Цвет чернил.
    */

    ctx.fillStyle=

        `rgba(
            35,
            65,
            150,
            ${Number(ink.value)/100}
        )`;


    ctx.textBaseline=
        "alphabetic";


    try{

        ctx.fontKerning="normal";

        ctx.fontVariantLigatures="normal";

    }catch(e){}


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.clip();


    /*
    Рисуем каждый абзац.
    */

    for(
        const paragraph
        of paragraphs
    ){

        /*
        Пустая строка.
        */

        if(!paragraph.trim()){

            y+=lineHeight;

            continue;

        }


        /*
        Разбиваем длинный текст
        на строки.
        */

        const lines=
            wrapText(
                paragraph,
                maxW
            );


        /*
        Каждая строка.
        */

        for(
            const currentLine
            of lines
        ){

            if(
                y>
                canvas.height-40
            ){

                ctx.restore();

                return;

            }


            drawLine(
                currentLine,
                startX,
                y
            );


            y+=lineHeight;

        }


        /*
        Небольшой промежуток
        между абзацами.
        */

        if(
            paragraphs.length>1
        ){

            y+=
                fontSize*
                0.12;

        }

    }


    ctx.restore();

}


/*
====================================================
КНОПКА СОЗДАТЬ
====================================================
*/

document
.getElementById("create")
.addEventListener(
    "click",
    async()=>{

        await document.fonts.ready;

        drawPaper();

    }
);


/*
====================================================
СОХРАНЕНИЕ PNG
====================================================
*/

document
.getElementById("save")
.addEventListener(
    "click",
    async()=>{

        await document.fonts.ready;

        drawPaper();


        setTimeout(()=>{

            const link=
                document.createElement("a");


            link.download=
                "HandWrite-A4.png";


            link.href=
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        },500);

    }
);


/*
====================================================
АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
====================================================
*/

[
    paper,
    style,
    size,
    line,
    slant,
    jitter,
    word,
    top,
    left,
    x,
    width,
    ink

].forEach(el=>{

    el.addEventListener(
        "input",
        ()=>{

            updateValues();

            drawPaper();

        }
    );


    el.addEventListener(
        "change",
        ()=>{

            updateValues();

            drawPaper();

        }
    );

});


/*
====================================================
ЗАПУСК
====================================================
*/

updateValues();


document.fonts.ready.then(()=>{

    drawPaper();

});

</script>

</body>
</html>
