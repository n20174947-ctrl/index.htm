<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✍️ HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#e9e9e9;
    font-family:Arial,sans-serif;
    color:#222;
}

h1{
    text-align:center;
    margin:5px 0 15px;
    font-size:25px;
}

.panel{
    max-width:900px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 10px #bbb;
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    padding:12px;
    font-size:17px;
    border:1px solid #bbb;
    border-radius:8px;
    margin-bottom:12px;
}

.main-settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.setting{
    background:#f5f5f5;
    padding:9px;
    border-radius:8px;
}

.setting label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

select,
input[type="range"]{
    width:100%;
}

.value{
    float:right;
    font-weight:normal;
    color:#555;
}

details{
    margin-top:10px;
    background:#f5f5f5;
    border-radius:8px;
    overflow:hidden;
}

summary{
    cursor:pointer;
    padding:10px;
    font-weight:bold;
    user-select:none;
}

.details-content{
    padding:5px 10px 10px;
}

.option{
    margin-top:9px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.canvas-wrap{
    margin:20px auto 0;
    max-width:900px;
    text-align:center;
}

canvas{
    width:100%;
    height:auto;
    background:white;
    box-shadow:0 2px 10px #aaa;
}

@media(max-width:650px){
    .main-settings{
        grid-template-columns:1fr;
    }

    body{
        padding:8px;
    }
}
</style>
</head>

<body>

<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введите текст здесь..."></textarea>

<div class="main-settings">

    <div class="setting">
        <label>Стиль почерка</label>
        <select id="style">
            <option value="badscript">Bad Script</option>
            <option value="caveat">Caveat</option>
            <option value="marck">Marck Script</option>
            <option value="kalam">Kalam</option>
            <option value="neucha">Neucha</option>
            <option value="pangolin">Pangolin</option>
        </select>
    </div>

    <div class="setting">
        <label>Бумага</label>
        <select id="paper">
            <option value="plain">Белый лист</option>
            <option value="tetrad1">Тетрадь 1</option>
            <option value="tetrad2">Тетрадь 2</option>
        </select>
    </div>

</div>

<details open>
    <summary>✏️ Размер текста</summary>

    <div class="details-content">

        <div class="option">
            <label>
                Размер
                <span class="value" id="sizeVal">30</span>
            </label>
            <input id="size" type="range" min="16" max="60" value="30">
        </div>

        <div class="option">
            <label>
                Межстрочный интервал
                <span class="value" id="lineVal">1.4</span>
            </label>
            <input id="line" type="range" min="1" max="2" step="0.1" value="1.4">
        </div>

    </div>
</details>

<details>
    <summary>🖊️ Реалистичность почерка</summary>

    <div class="details-content">

        <div class="option">
            <label>
                Наклон
                <span class="value" id="slantVal">0</span>
            </label>
            <input id="slant" type="range" min="-8" max="8" value="0">
        </div>

        <div class="option">
            <label>
                Неровность
                <span class="value" id="jitterVal">2</span>
            </label>
            <input id="jitter" type="range" min="0" max="6" step="1" value="2">
        </div>

        <div class="option">
            <label>
                Расстояние между словами
                <span class="value" id="wordVal">1</span>
            </label>
            <input id="word" type="range" min="0.7" max="1.5" step="0.1" value="1">
        </div>

        <div class="option">
            <label>
                Прозрачность чернил
                <span class="value" id="inkVal">92</span>
            </label>
            <input id="ink" type="range" min="60" max="100" value="92">
        </div>

    </div>
</details>

<details>
    <summary>📐 Положение текста</summary>

    <div class="details-content">

        <div class="option">
            <label>
                Отступ сверху
                <span class="value" id="topVal">70</span>
            </label>
            <input id="top" type="range" min="0" max="300" value="70">
        </div>

        <div class="option">
            <label>
                Отступ слева
                <span class="value" id="leftVal">80</span>
            </label>
            <input id="left" type="range" min="0" max="300" value="80">
        </div>

        <div class="option">
            <label>
                Смещение X
                <span class="value" id="xVal">0</span>
            </label>
            <input id="x" type="range" min="-250" max="250" value="0">
        </div>

        <div class="option">
            <label>
                Ширина текста
                <span class="value" id="widthVal">800</span>
            </label>
            <input id="width" type="range" min="300" max="1100" value="800">
        </div>

    </div>
</details>

<div class="buttons">
    <button id="create">✍️ Создать</button>
    <button id="save">💾 Сохранить PNG</button>
</div>

</div>

<div class="canvas-wrap">
    <canvas id="canvas" width="1240" height="1754"></canvas>
</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const text = document.getElementById("text");
const style = document.getElementById("style");
const paper = document.getElementById("paper");

const size = document.getElementById("size");
const line = document.getElementById("line");
const slant = document.getElementById("slant");
const jitter = document.getElementById("jitter");
const word = document.getElementById("word");
const ink = document.getElementById("ink");

const top = document.getElementById("top");
const left = document.getElementById("left");
const x = document.getElementById("x");
const width = document.getElementById("width");


function val(el){
    return parseFloat(el.value);
}


function updateValues(){

    document.getElementById("sizeVal").textContent = size.value;
    document.getElementById("lineVal").textContent = line.value;
    document.getElementById("slantVal").textContent = slant.value;
    document.getElementById("jitterVal").textContent = jitter.value;
    document.getElementById("wordVal").textContent = word.value;
    document.getElementById("inkVal").textContent = ink.value;

    document.getElementById("topVal").textContent = top.value;
    document.getElementById("leftVal").textContent = left.value;
    document.getElementById("xVal").textContent = x.value;
    document.getElementById("widthVal").textContent = width.value;
}


/* =========================================================
   ГЛАВНОЕ ИСПРАВЛЕНИЕ:
   картинки находятся внутри /index.htm/
   ========================================================= */

function getImageSrc(){

    if(paper.value === "tetrad1"){
        return "./tetrad1.jpg";
    }

    if(paper.value === "tetrad2"){
        return "./tetrad2.jpg";
    }

    return "";
}


function random(min,max){
    return Math.random()*(max-min)+min;
}


function getFont(){

    switch(style.value){

        case "caveat":
            return "Caveat";

        case "marck":
            return "Marck Script";

        case "kalam":
            return "Kalam";

        case "neucha":
            return "Neucha";

        case "pangolin":
            return "Pangolin";

        default:
            return "Bad Script";
    }
}


function prepareFont(){

    ctx.font = `${val(size)}px "${getFont()}"`;
}


function wrapText(str,maxWidth){

    prepareFont();

    const words = str.split(/\s+/);
    const lines = [];

    let current = "";

    for(let i=0;i<words.length;i++){

        const test = current
            ? current + " " + words[i]
            : words[i];

        if(ctx.measureText(test).width <= maxWidth){
            current = test;
        }
        else{

            if(current){
                lines.push(current);
            }

            current = words[i];
        }
    }

    if(current){
        lines.push(current);
    }

    return lines;
}


/* Области тетрадных листов */

function paperRegion(){

    if(paper.value === "tetrad1"){

        return {
            x:105,
            y:145,
            w:1060,
            h:1530
        };

    }

    if(paper.value === "tetrad2"){

        return {
            x:55,
            y:75,
            w:1120,
            h:1600
        };

    }

    return {
        x:0,
        y:0,
        w:1240,
        h:1754
    };
}


/* Рисуем бумагу */

function drawPaper(){

    const src = getImageSrc();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* Обычный белый лист */

    if(!src){

        ctx.fillStyle = "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const img = new Image();

    img.onload = function(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const r = paperRegion();

        /*
         * Масштабируем фотографию так,
         * чтобы она полностью закрывала область.
         */

        const scale = Math.max(
            canvas.width / r.w,
            canvas.height / r.h
        );

        const dw = img.width * scale;
        const dh = img.height * scale;

        const dx = -r.x * scale;
        const dy = -r.y * scale;

        ctx.drawImage(
            img,
            dx,
            dy,
            dw,
            dh
        );

        createText();
    };


    img.onerror = function(){

        console.error(
            "Не удалось загрузить:",
            src
        );

        ctx.fillStyle = "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "#b00020";

        ctx.font = "28px Arial";

        ctx.fillText(
            "Не удалось загрузить изображение тетради",
            40,
            70
        );

        ctx.font = "18px Arial";

        ctx.fillText(
            src,
            40,
            110
        );

    };


    /*
     * ВАЖНО:
     * добавляем параметр для предотвращения кэша.
     */

    img.src = src + "?v=" + Date.now();
}


/* Рисование отдельного слова */

function drawWord(wordText,xPos,yPos){

    prepareFont();

    const j = val(jitter);

    const offsetX = random(-j,j);
    const offsetY = random(-j,j);

    const angle =
        random(
            -val(slant),
            val(slant)
        ) * Math.PI / 180;


    ctx.save();

    ctx.translate(
        xPos + offsetX,
        yPos + offsetY
    );

    ctx.rotate(angle);

    ctx.globalAlpha =
        val(ink) / 100;

    ctx.fillStyle = "#222";

    ctx.fillText(
        wordText,
        0,
        0
    );

    ctx.restore();

    ctx.globalAlpha = 1;
}


/* Рисование строки */

function drawLine(lineText,xPos,yPos){

    prepareFont();

    const words = lineText.split(/\s+/);

    let currentX = xPos;

    const extraWordSpace =
        val(size) * (val(word)-1);


    for(let i=0;i<words.length;i++){

        const wordText = words[i];

        drawWord(
            wordText,
            currentX,
            yPos
        );

        const wordWidth =
            ctx.measureText(wordText).width;

        currentX +=
            wordWidth +
            ctx.measureText(" ").width +
            extraWordSpace;
    }
}


/* Основное создание текста */

function createText(){

    const value = text.value.trim();

    if(!value){
        return;
    }


    const r = paperRegion();

    const startX =
        r.x +
        val(left) +
        val(x);

    const maxWidth =
        Math.min(
            val(width),
            r.w - val(left) - 20
        );

    let lines = [];


    /*
     * Сохраняем абзацы.
     */

    const paragraphs =
        value.split(/\n/);


    for(let p=0;p<paragraphs.length;p++){

        const paragraph =
            paragraphs[p].trim();

        if(paragraph === ""){

            lines.push("");

            continue;
        }

        const wrapped =
            wrapText(
                paragraph,
                maxWidth
            );

        lines.push(...wrapped);
    }


    let y =
        r.y +
        val(top) +
        val(size);


    const lineHeight =
        val(size) *
        val(line);


    for(let i=0;i<lines.length;i++){

        if(lines[i] !== ""){

            drawLine(
                lines[i],
                startX,
                y
            );

        }

        y += lineHeight;
    }
}


/* Кнопка создания */

document
    .getElementById("create")
    .addEventListener(
        "click",
        function(){

            updateValues();

            drawPaper();

        }
    );


/* Сохранение PNG */

document
    .getElementById("save")
    .addEventListener(
        "click",
        function(){

            const link =
                document.createElement("a");

            link.download =
                "handwrite-a4.png";

            link.href =
                canvas.toDataURL("image/png");

            link.click();

        }
    );


/* Изменение настроек */

[
    size,
    line,
    slant,
    jitter,
    word,
    ink,
    top,
    left,
    x,
    width
].forEach(function(el){

    el.addEventListener(
        "input",
        updateValues
    );

});


/* Если меняется бумага или почерк */

paper.addEventListener(
    "change",
    drawPaper
);

style.addEventListener(
    "change",
    function(){

        if(text.value.trim()){
            drawPaper();
        }

    }
);


/* Начальные значения */

updateValues();


/*
 * Ждём загрузки Google Fonts,
 * затем рисуем.
 */

document.fonts.ready.then(
    function(){

        drawPaper();

    }
);

</script>

</body>
</html>
