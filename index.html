<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:170px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){
    .controls{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введи или вставь сюда текст..."></textarea>

<div class="controls">

<label>
Стиль почерка
<select id="style">

<option value="marck">Рукописный — Marck Script</option>
<option value="badscript">Небрежный — Bad Script</option>
<option value="caveat">Живой — Caveat</option>
<option value="kalam">Живой — Kalam</option>
<option value="neucha">Аккуратный — Neucha</option>

</select>
</label>


<label>
Бумага
<select id="paper">

<option value="plain">Чистая</option>
<option value="tetrad1">Тетрадь — левая поля</option>
<option value="tetrad2">Тетрадь — правая поля</option>

</select>
</label>


<div class="option">

<label>
Размер: <span id="sizeValue">30</span> px
</label>

<input
id="size"
type="range"
min="16"
max="65"
value="30"
>

</div>


<div class="option">

<label>
Интервал строк:
<span id="lineValue">1.45</span>
</label>

<input
id="line"
type="range"
min="1"
max="2"
step="0.05"
value="1.45"
>

</div>


<div class="option">

<label>
Начало текста X:
<span id="xOffsetValue">110</span> px
</label>

<input
id="xOffset"
type="range"
min="0"
max="500"
value="110"
>

</div>


<div class="option">

<label>
Верх листа Y:
<span id="yOffsetValue">160</span> px
</label>

<input
id="yOffset"
type="range"
min="0"
max="600"
value="160"
>

</div>


<div class="option">

<label>
Ширина строки:
<span id="widthValue">1000</span> px
</label>

<input
id="width"
type="range"
min="200"
max="1200"
value="1000"
>

</div>


<div class="option">

<label>
Неровность почерка:
<span id="roughValue">1</span>
</label>

<input
id="rough"
type="range"
min="0"
max="3"
step="0.1"
value="1"
>

</div>

</div>


<div class="option" style="margin-top:10px;">

<label>
Наклон почерка:
<span id="tiltValue">0</span>
</label>

<input
id="tilt"
type="range"
min="-3"
max="3"
step="0.1"
value="0"
>

</div>


<button id="create">
Создать лист
</button>

<button id="save">
Сохранить PNG
</button>


<div class="preview">

<canvas
id="canvas"
width="1240"
height="1754">
</canvas>

</div>

</div>
</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const text =
document.getElementById("text");

const paper =
document.getElementById("paper");

const style =
document.getElementById("style");

const size =
document.getElementById("size");

const line =
document.getElementById("line");

const xOffset =
document.getElementById("xOffset");

const yOffset =
document.getElementById("yOffset");

const width =
document.getElementById("width");

const rough =
document.getElementById("rough");

const tilt =
document.getElementById("tilt");


/* =========================
   ПОЛЯ ЛИСТА
========================= */

/*
   Эти значения определяют,
   где НА САМОМ ФОТО начинается
   настоящий лист тетради.

   Их можно менять ползунками.
*/

let pageLeft = 70;
let pageTop = 120;
let pageRight = 1160;
let pageBottom = 1680;


/* =========================
   ОБНОВЛЕНИЕ ЗНАЧЕНИЙ
========================= */

function updateValues(){

    document.getElementById(
        "sizeValue"
    ).textContent = size.value;

    document.getElementById(
        "lineValue"
    ).textContent = line.value;

    document.getElementById(
        "xOffsetValue"
    ).textContent = xOffset.value;

    document.getElementById(
        "yOffsetValue"
    ).textContent = yOffset.value;

    document.getElementById(
        "widthValue"
    ).textContent = width.value;

    document.getElementById(
        "roughValue"
    ).textContent = rough.value;

    document.getElementById(
        "tiltValue"
    ).textContent = tilt.value;
}


/* =========================
   ФОТО ТЕТРАДИ
========================= */

function getImageSrc(){

    if(paper.value === "tetrad1"){
        return "tetrad1.jpg";
    }

    if(paper.value === "tetrad2"){
        return "tetrad2.jpg";
    }

    return "";
}


/* =========================
   ШРИФТ
========================= */

function getFont(){

    if(style.value === "marck"){
        return "Marck Script";
    }

    if(style.value === "badscript"){
        return "Bad Script";
    }

    if(style.value === "caveat"){
        return "Caveat";
    }

    if(style.value === "kalam"){
        return "Kalam";
    }

    if(style.value === "neucha"){
        return "Neucha";
    }

    return "Marck Script";
}


/* =========================
   СЛУЧАЙНОЕ ЧИСЛО
========================= */

function random(min,max){

    return Math.random() *
    (max-min) + min;

}


/* =========================
   ПЕРЕНОС СТРОК
========================= */

/*
   ВАЖНО:

   Здесь мы НЕ уничтожаем
   несколько пробелов.

   Поэтому можно написать:

   Дата:                    08.10

   и число реально будет
   находиться дальше.
*/

function wrapText(text,maxWidth){

    const result = [];

    const paragraphs =
        text.replace(/\r/g,"").split("\n");


    for(const paragraph of paragraphs){

        if(paragraph === ""){
            result.push("");
            continue;
        }


        let current = "";


        /*
           Разбиваем строку по пробелам,
           но сохраняем сами пробелы.
        */

        const parts =
            paragraph.match(/\S+|\s+/g) || [];


        for(const part of parts){

            const test =
                current + part;


            if(
                ctx.measureText(test).width >
                maxWidth
                &&
                current.trim() !== ""
                &&
                !/^\s+$/.test(part)
            ){

                result.push(current);

                current = part.trimStart();

            }else{

                current = test;
            }
        }


        if(current !== ""){
            result.push(current);
        }
    }


    return result;
}


/* =========================
   РИСУЕМ ФОН
========================= */

function drawBackground(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(paper.value === "plain"){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const src =
    getImageSrc();


    const img =
    new Image();


    img.onload = function(){

        /*
           Фото растягивается
           на весь canvas,
           как раньше.
        */

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();
    };


    img.onerror = function(){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();
    };


    img.src = src;
}


/* =========================
   ОСНОВНОЙ РЕНДЕР ТЕКСТА
========================= */

function createText(){

    const fontSize =
    Number(size.value);


    const spacing =
    Number(line.value);


    const startX =
    Number(xOffset.value);


    const startY =
    Number(yOffset.value);


    const maxWidth =
    Number(width.value);


    const roughness =
    Number(rough.value);


    const tiltValue =
    Number(tilt.value);


    /*
       Очень важно:

       Теперь текст рисуется НЕ
       отдельными буквами.

       Мы рисуем целые строки.

       Благодаря этому:
       - буквы соединяются;
       - сохраняются особенности шрифта;
       - почерк выглядит намного естественнее.
    */

    ctx.font =
        fontSize +
        "px " +
        getFont();


    /*
       Включаем обычные
       лигатуры шрифта.
    */

    ctx.fontKerning = "normal";

    ctx.fontVariantLigatures = "normal";


    ctx.fillStyle =
        "#17459b";


    ctx.textBaseline =
        "alphabetic";


    const lineHeight =
        fontSize * spacing;


    let y =
        startY + fontSize;


    const lines =
        wrapText(
            text.value,
            maxWidth
        );


    /*
       Реальная область текста.
    */

    ctx.save();


    ctx.beginPath();

    ctx.rect(
        pageLeft,
        pageTop,
        pageRight - pageLeft,
        pageBottom - pageTop
    );

    ctx.clip();


    for(const currentLine of lines){

        if(
            y >
            pageBottom
        ){
            break;
        }


        /*
           Пустая строка.
        */

        if(currentLine === ""){

            y += lineHeight;

            continue;
        }


        /*
           Небольшое естественное
           отклонение всей строки.
        */

        const yJitter =
            roughness > 0
            ? random(
                -roughness,
                roughness
            )
            : 0;


        const rotation =
            (
                Number(tiltValue)
                +
                random(
                    -roughness,
                    roughness
                )
            )
            *
            Math.PI
            /
            180;


        ctx.save();


        /*
           Начальная точка строки.
        */

        ctx.translate(
            startX,
            y + yJitter
        );


        ctx.rotate(rotation);


        /*
           Рисуем ВСЮ строку сразу.

           Именно это делает соединение
           букв намного естественнее.
        */

        ctx.fillText(
            currentLine,
            0,
            0
        );


        ctx.restore();


        y += lineHeight;
    }


    ctx.restore();
}


/* =========================
   СОЗДАТЬ
========================= */

document
.getElementById("create")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawBackground();

    }
);


/* =========================
   СОХРАНИТЬ
========================= */

document
.getElementById("save")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawBackground();


        setTimeout(
            function(){

                const link =
                    document.createElement("a");


                link.download =
                    "HandWrite-A4.png";


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                link.click();

            },
            500
        );
    }
);


/* =========================
   АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
========================= */

[
    paper,
    style,
    size,
    line,
    xOffset,
    yOffset,
    width,
    rough,
    tilt
]
.forEach(
    function(element){

        element.addEventListener(
            "input",
            function(){

                updateValues();

                drawBackground();

            }
        );


        element.addEventListener(
            "change",
            function(){

                updateValues();

                drawBackground();

            }
        );

    }
);


/* =========================
   ЗАПУСК
========================= */

updateValues();


document.fonts.ready.then(
    function(){

        drawBackground();

    }
);

</script>

</body>
</html>
