<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Marck+Script&family=Neucha&family=Pangolin&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:150px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
}

.main-settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.setting{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

details{
    margin-top:10px;
    background:#f3f3f3;
    border-radius:12px;
    overflow:hidden;
}

summary{
    cursor:pointer;
    padding:13px;
    font-weight:bold;
    font-size:15px;
    user-select:none;
}

details[open] summary{
    border-bottom:1px solid #ddd;
}

.details-content{
    padding:10px;
}

.option{
    background:white;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
}

.option:last-child{
    margin-bottom:0;
}

.value{
    font-weight:normal;
    color:#555;
}

.small{
    font-size:12px;
    color:#666;
    margin-top:5px;
    line-height:1.35;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){

    .main-settings{
        grid-template-columns:1fr;
    }

    textarea{
        height:130px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea id="text" placeholder="Введи или вставь сюда текст..."></textarea>

<div class="main-settings">

<div class="setting">
<label>Стиль почерка</label>

<select id="style">
<option value="badscript">Максимально рукописный — Bad Script</option>
<option value="caveat">Похожий на тетрадный — Caveat</option>
<option value="marck">Связный — Marck Script</option>
<option value="kalam">Живой — Kalam</option>
<option value="neucha">Аккуратный — Neucha</option>
<option value="pangolin">Неровный — Pangolin</option>
</select>
</div>

<div class="setting">
<label>Бумага</label>

<select id="paper">
<option value="plain">Чистая</option>
<option value="tetrad1">Тетрадь — левая поля</option>
<option value="tetrad2">Тетрадь — правая поля</option>
</select>
</div>

</div>


<details open>

<summary>✏️ Размер текста</summary>

<div class="details-content">

<div class="option">

<label>
Размер:
<span class="value">
<span id="sizeValue">30</span> px
</span>
</label>

<input id="size" type="range" min="16" max="60" value="30">

</div>

<div class="option">

<label>
Интервал строк:
<span class="value">
<span id="lineValue">1.4</span>
</span>
</label>

<input id="line" type="range" min="1" max="2" step="0.05" value="1.4">

</div>

</div>

</details>


<details>

<summary>🖊️ Реалистичность почерка</summary>

<div class="details-content">

<div class="option">

<label>
Наклон:
<span class="value">
<span id="slantValue">0</span>°
</span>
</label>

<input id="slant" type="range" min="-8" max="8" step="0.5" value="0">

</div>

<div class="option">

<label>
Естественная неровность:
<span class="value">
<span id="jitterValue">2</span> px
</span>
</label>

<input id="jitter" type="range" min="0" max="6" step="0.5" value="2">

</div>

<div class="option">

<label>
Расстояние между словами:
<span class="value">
<span id="wordValue">1</span>
</span>
</label>

<input id="word" type="range" min="0.7" max="1.5" step="0.05" value="1">

</div>

<div class="option">

<label>
Прозрачность чернил:
<span class="value">
<span id="inkValue">92</span>%
</span>
</label>

<input id="ink" type="range" min="60" max="100" value="92">

</div>

</div>

</details>


<details>

<summary>📐 Положение текста</summary>

<div class="details-content">

<div class="option">

<label>
Верхнее поле:
<span class="value">
<span id="topValue">70</span> px
</span>
</label>

<input id="top" type="range" min="0" max="300" value="70">

</div>

<div class="option">

<label>
Левое поле:
<span class="value">
<span id="leftValue">80</span> px
</span>
</label>

<input id="left" type="range" min="0" max="300" value="80">

</div>

<div class="option">

<label>
Смещение по X:
<span class="value">
<span id="xValue">0</span> px
</span>
</label>

<input id="x" type="range" min="-250" max="250" value="0">

<div class="small">
Положительное значение двигает текст вправо,
отрицательное — влево.
</div>

</div>

<div class="option">

<label>
Ширина текста:
<span class="value">
<span id="widthValue">800</span> px
</span>
</label>

<input id="width" type="range" min="300" max="1100" value="800">

</div>

</div>

</details>


<button id="create">
Создать лист
</button>

<button id="save">
Сохранить PNG
</button>


<div class="preview">

<canvas id="canvas" width="1240" height="1754"></canvas>

</div>

</div>
</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const text=document.getElementById("text");
const paper=document.getElementById("paper");
const style=document.getElementById("style");

const size=document.getElementById("size");
const line=document.getElementById("line");
const slant=document.getElementById("slant");
const jitter=document.getElementById("jitter");
const word=document.getElementById("word");
const top=document.getElementById("top");
const left=document.getElementById("left");
const x=document.getElementById("x");
const width=document.getElementById("width");
const ink=document.getElementById("ink");


function val(id){
    return document.getElementById(id);
}


function updateValues(){

    val("sizeValue").textContent=size.value;
    val("lineValue").textContent=line.value;
    val("slantValue").textContent=slant.value;
    val("jitterValue").textContent=jitter.value;
    val("wordValue").textContent=word.value;
    val("topValue").textContent=top.value;
    val("leftValue").textContent=left.value;
    val("xValue").textContent=x.value;
    val("widthValue").textContent=width.value;
    val("inkValue").textContent=ink.value;

}


/*
====================================================
ТЕТРАДЬ
====================================================
*/

function getImageSrc(){

    /*
    Используем корень GitHub Pages.
    Это важно, потому что страница открывается
    через /index.htm/
    */

    if(paper.value==="tetrad1"){
        return new URL(
            "/tetrad1.jpg",
            window.location.origin
        ).href;
    }

    if(paper.value==="tetrad2"){
        return new URL(
            "/tetrad2.jpg",
            window.location.origin
        ).href;
    }

    return "";

}


/*
====================================================
СЛУЧАЙНОЕ ЧИСЛО
====================================================
*/

function random(min,max){

    return Math.random()*(max-min)+min;

}


/*
====================================================
ШРИФТ
====================================================
*/

function getFont(){

    if(style.value==="badscript")
        return "Bad Script";

    if(style.value==="caveat")
        return "Caveat";

    if(style.value==="marck")
        return "Marck Script";

    if(style.value==="kalam")
        return "Kalam";

    if(style.value==="neucha")
        return "Neucha";

    if(style.value==="pangolin")
        return "Pangolin";

    return "Bad Script";

}


/*
====================================================
ПОДГОТОВКА ШРИФТА
====================================================
*/

function prepareFont(){

    const s=Number(size.value);

    ctx.font=`${s}px "${getFont()}"`;

    try{
        ctx.fontKerning="normal";
        ctx.fontVariantLigatures="normal";
        ctx.fontStretch="normal";
    }catch(e){}

}


/*
====================================================
ПЕРЕНОС СТРОК
====================================================
*/

function wrapText(str,maxWidth){

    const words=str.trim().split(/\s+/);

    const result=[];

    let current="";


    for(const w of words){

        const test=current
            ? current+" "+w
            : w;


        if(
            ctx.measureText(test).width>maxWidth
            &&
            current
        ){

            result.push(current);

            current=w;

        }else{

            current=test;

        }

    }


    if(current)
        result.push(current);


    return result;

}


/*
====================================================
ОБЛАСТЬ ФОТОГРАФИИ ТЕТРАДИ
====================================================
*/

const paperRegion={

    tetrad1:{
        x:105,
        y:145,
        w:1060,
        h:1530
    },

    tetrad2:{
        x:55,
        y:75,
        w:1120,
        h:1600
    }

};


/*
====================================================
РИСОВАНИЕ БУМАГИ
====================================================
*/

function drawPaper(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    ЧИСТЫЙ ЛИСТ
    */

    if(paper.value==="plain"){

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        createText();

        return;
    }


    const src=getImageSrc();

    const img=new Image();


    img.onload=function(){

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const r=paperRegion[paper.value];


        ctx.save();

        ctx.beginPath();

        ctx.rect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.clip();


        const scale=Math.max(

            canvas.width/r.w,

            canvas.height/r.h

        );


        const dw=img.width*scale;

        const dh=img.height*scale;


        const dx=-r.x*scale;

        const dy=-r.y*scale;


        ctx.drawImage(
            img,
            dx,
            dy,
            dw,
            dh
        );


        ctx.restore();


        createText();

    };


    img.onerror=function(){

        console.error(
            "ОШИБКА ЗАГРУЗКИ ТЕТРАДИ:",
            src
        );

        /*
        Если изображение не загрузилось,
        показываем красное сообщение вместо
        молчаливого белого листа.
        */

        ctx.fillStyle="#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle="#b00020";

        ctx.font="28px Arial";

        ctx.fillText(
            "Не удалось загрузить изображение тетради",
            50,
            80
        );

        ctx.font="20px Arial";

        ctx.fillText(
            src,
            50,
            120
        );

        createText();

    };


    /*
    Добавляем случайный параметр,
    чтобы GitHub Pages не отдавал старую
    закэшированную версию.
    */

    img.src=src+"?v="+Date.now();

}


/*
====================================================
СЛОВО
====================================================
*/

function drawWord(
    wordText,
    xPos,
    yPos
){

    const j=
        Number(jitter.value);


    const yMove=
        random(-j,j);


    const angle=

        random(
            -0.012,
            0.012
        )

        +

        Number(slant.value)
        *
        Math.PI
        /
        180;


    ctx.save();


    ctx.translate(
        xPos,
        yPos+yMove
    );


    ctx.rotate(angle);


    const sx=
        random(
            0.985,
            1.015
        );


    const sy=
        random(
            0.98,
            1.02
        );


    ctx.scale(
        sx,
        sy
    );


    ctx.fillText(
        wordText,
        0,
        0
    );


    ctx.restore();


    return ctx.measureText(
        wordText
    ).width*sx;

}


/*
====================================================
СТРОКА
====================================================
*/

function drawLine(
    lineText,
    xPos,
    yPos
){

    const wordScale=
        Number(word.value);


    const words=
        lineText.split(" ");


    let cursor=xPos;


    for(const w of words){

        if(!w)
            continue;


        const wordWidth=
            ctx.measureText(w).width;


        drawWord(
            w,
            cursor,
            yPos
        );


        const normalSpace=
            ctx.measureText(" ").width;


        const natural=
            random(
                0.94,
                1.06
            );


        cursor+=

            wordWidth

            +

            normalSpace
            *
            wordScale
            *
            natural;

    }

}


/*
====================================================
ТЕКСТ
====================================================
*/

function createText(){

    prepareFont();


    const fontSize=
        Number(size.value);


    const spacing=
        Number(line.value);


    const maxW=
        Number(width.value);


    const startX=

        Number(left.value)
        +
        Number(x.value);


    let y=

        Number(top.value)
        +
        fontSize;


    const lineHeight=
        fontSize*spacing;


    const paragraphs=

        text.value
        .replace(/\r/g,"")
        .split("\n");


    ctx.fillStyle=
        `rgba(
            35,
            65,
            150,
            ${Number(ink.value)/100}
        )`;


    ctx.textBaseline="alphabetic";


    try{

        ctx.fontKerning="normal";
        ctx.fontVariantLigatures="normal";

    }catch(e){}


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.clip();


    for(
        const paragraph
        of paragraphs
    ){

        if(!paragraph.trim()){

            y+=lineHeight;

            continue;

        }


        const lines=
            wrapText(
                paragraph,
                maxW
            );


        for(
            const currentLine
            of lines
        ){

            if(
                y>
                canvas.height-40
            ){

                ctx.restore();

                return;

            }


            drawLine(
                currentLine,
                startX,
                y
            );


            y+=lineHeight;

        }


        if(
            paragraphs.length>1
        ){

            y+=
                fontSize*0.12;

        }

    }


    ctx.restore();

}


/*
====================================================
СОЗДАТЬ ЛИСТ
====================================================
*/

document
.getElementById("create")
.addEventListener(
    "click",
    async()=>{

        await document.fonts.ready;

        drawPaper();

    }
);


/*
====================================================
СОХРАНИТЬ PNG
====================================================
*/

document
.getElementById("save")
.addEventListener(
    "click",
    async()=>{

        await document.fonts.ready;

        drawPaper();


        setTimeout(()=>{

            const link=
                document.createElement("a");


            link.download=
                "HandWrite-A4.png";


            link.href=
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        },500);

    }
);


/*
====================================================
ОБНОВЛЕНИЕ ЗНАЧЕНИЙ
====================================================
*/

[
    paper,
    style,
    size,
    line,
    slant,
    jitter,
    word,
    top,
    left,
    x,
    width,
    ink

].forEach(el=>{

    el.addEventListener(
        "input",
        ()=>{

            updateValues();

        }
    );


    el.addEventListener(
        "change",
        ()=>{

            updateValues();

            drawPaper();

        }
    );

});


/*
====================================================
ЗАПУСК
====================================================
*/

updateValues();


document.fonts.ready.then(()=>{

    drawPaper();

});

</script>

</body>
</html>
