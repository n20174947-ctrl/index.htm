<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HandWrite A4</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Marck+Script&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Neucha&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#625c53;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 5px 25px #0005;
}

h1{
    text-align:center;
    margin:5px 0 15px;
}

textarea{
    width:100%;
    height:180px;
    padding:12px;
    border:1px solid #bbb;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
    white-space:pre-wrap;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

label{
    font-size:14px;
    font-weight:bold;
}

select,
input{
    width:100%;
    margin-top:6px;
}

select{
    padding:10px;
    border:1px solid #bbb;
    border-radius:10px;
    background:white;
}

.option{
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
}

#create{
    background:#222;
    color:white;
}

#save{
    background:#ddd;
}

.preview{
    margin-top:15px;
    padding:10px;
    background:#403c36;
    border-radius:14px;
    overflow:auto;
}

canvas{
    display:block;
    width:100%;
    height:auto;
    background:white;
}

@media(max-width:600px){

    .controls{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="panel">

<h1>✍️ HandWrite A4</h1>

<textarea
id="text"
placeholder="Введи или вставь сюда текст...

Пробелы в начале строки сохраняются."
></textarea>


<div class="controls">

<label>
Шрифт
<select id="style">

<option value="marck">
Marck Script — связный
</option>

<option value="badscript">
Bad Script — живой
</option>

<option value="caveat">
Caveat — рукописный
</option>

<option value="kalam">
Kalam — школьный
</option>

<option value="neucha">
Neucha — простой
</option>

</select>
</label>


<label>
Бумага
<select id="paper">

<option value="plain">
Чистая
</option>

<option value="tetrad1">
Тетрадь — левая поля
</option>

<option value="tetrad2">
Тетрадь — правая поля
</option>

</select>
</label>


<div class="option">

<label>
Размер:
<span id="sizeValue">30</span> px
</label>

<input
id="size"
type="range"
min="16"
max="65"
value="30"
>

</div>


<div class="option">

<label>
Расстояние между строками:
<span id="lineValue">1.45</span>
</label>

<input
id="line"
type="range"
min="1"
max="2"
step="0.05"
value="1.45"
>

</div>

</div>


<!-- НАСТРОЙКИ ЛИСТА -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Левая граница листа:
<span id="pageLeftValue">85</span>
px
</label>

<input
id="pageLeft"
type="range"
min="0"
max="300"
value="85"
>

</div>


<div
class="option"
style="margin-top:10px;"
>

<label>
Правая граница листа:
<span id="pageRightValue">1130</span>
px
</label>

<input
id="pageRight"
type="range"
min="900"
max="1240"
value="1130"
>

</div>


<div
class="option"
style="margin-top:10px;"
>

<label>
Верх листа:
<span id="pageTopValue">150</span>
px
</label>

<input
id="pageTop"
type="range"
min="0"
max="400"
value="150"
>

</div>


<div
class="option"
style="margin-top:10px;"
>

<label>
Низ листа:
<span id="pageBottomValue">1650</span>
px
</label>

<input
id="pageBottom"
type="range"
min="1200"
max="1754"
value="1650"
>

</div>


<!-- ОТСТУП ОТ ПОЛЯ -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Отступ от поля:
<span id="leftMarginValue">30</span>
px
</label>

<input
id="leftMargin"
type="range"
min="0"
max="150"
value="30"
>

</div>


<!-- ДОПОЛНИТЕЛЬНЫЙ X -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Сдвиг текста по X:
<span id="xOffsetValue">0</span>
px
</label>

<input
id="xOffset"
type="range"
min="-300"
max="300"
value="0"
>

</div>


<!-- Y -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Сдвиг текста по Y:
<span id="yOffsetValue">0</span>
px
</label>

<input
id="yOffset"
type="range"
min="-150"
max="150"
value="0"
>

</div>


<!-- ШИРИНА -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Ширина текста:
<span id="widthValue">1000</span>
px
</label>

<input
id="width"
type="range"
min="300"
max="1200"
value="1000"
>

</div>


<!-- РЕАЛИЗМ -->

<div
class="option"
style="margin-top:10px;"
>

<label>
Живость почерка:
<span id="realismValue">35</span>
%
</label>

<input
id="realism"
type="range"
min="0"
max="100"
value="35"
>

</div>


<button id="create">
Создать лист
</button>

<button id="save">
Сохранить PNG
</button>


<div class="preview">

<canvas
id="canvas"
width="1240"
height="1754"
></canvas>

</div>

</div>
</div>


<script>


const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const text =
document.getElementById("text");

const paper =
document.getElementById("paper");

const style =
document.getElementById("style");


const size =
document.getElementById("size");

const line =
document.getElementById("line");


const pageLeft =
document.getElementById("pageLeft");

const pageRight =
document.getElementById("pageRight");

const pageTop =
document.getElementById("pageTop");

const pageBottom =
document.getElementById("pageBottom");


const leftMargin =
document.getElementById("leftMargin");


const xOffset =
document.getElementById("xOffset");

const yOffset =
document.getElementById("yOffset");


const width =
document.getElementById("width");


const realism =
document.getElementById("realism");



function updateValues(){

    document.getElementById("sizeValue")
    .textContent =
    size.value;


    document.getElementById("lineValue")
    .textContent =
    line.value;


    document.getElementById("pageLeftValue")
    .textContent =
    pageLeft.value;


    document.getElementById("pageRightValue")
    .textContent =
    pageRight.value;


    document.getElementById("pageTopValue")
    .textContent =
    pageTop.value;


    document.getElementById("pageBottomValue")
    .textContent =
    pageBottom.value;


    document.getElementById("leftMarginValue")
    .textContent =
    leftMargin.value;


    document.getElementById("xOffsetValue")
    .textContent =
    xOffset.value;


    document.getElementById("yOffsetValue")
    .textContent =
    yOffset.value;


    document.getElementById("widthValue")
    .textContent =
    width.value;


    document.getElementById("realismValue")
    .textContent =
    realism.value;

}



function getImageSrc(){

    if(
        paper.value ===
        "tetrad1"
    ){

        return "tetrad1.jpg";

    }


    if(
        paper.value ===
        "tetrad2"
    ){

        return "tetrad2.jpg";

    }


    return "";

}



function getFont(){

    if(
        style.value ===
        "marck"
    ){

        return "Marck Script";

    }


    if(
        style.value ===
        "badscript"
    ){

        return "Bad Script";

    }


    if(
        style.value ===
        "caveat"
    ){

        return "Caveat";

    }


    if(
        style.value ===
        "kalam"
    ){

        return "Kalam";

    }


    if(
        style.value ===
        "neucha"
    ){

        return "Neucha";

    }


    return "Marck Script";

}



function random(min,max){

    return Math.random() *
    (max-min) + min;

}



/*
   ВАЖНО:
   Эта функция НЕ удаляет пробелы.
   Поэтому можно писать:

             06.11

   или

                    06.11

   и пробелами двигать запись.
*/


function wrapText(lineText,maxWidth){

    const result = [];

    let current = "";


    /*
       Разбиваем посимвольно,
       чтобы сохранить пробелы.
    */

    for(
        const character
        of lineText
    ){

        const test =
        current +
        character;


        if(
            ctx.measureText(test).width
            >
            maxWidth
            &&
            current.trim() !== ""
        ){

            result.push(current);

            /*
               Если перенос произошёл
               на пробеле — не начинаем
               следующую строку с него.
            */

            current =
            character === " "
            ? ""
            : character;

        }
        else{

            current =
            test;

        }

    }


    if(
        current.length > 0
    ){

        result.push(current);

    }


    return result;

}



/*
   Рисуем бумагу
*/

function drawPaper(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        paper.value ===
        "plain"
    ){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

        return;

    }


    const src =
    getImageSrc();


    const img =
    new Image();


    img.onload =
    function(){

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

    };


    img.onerror =
    function(){

        ctx.fillStyle =
        "#fffdf8";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        createText();

        console.log(
            "Не удалось загрузить:",
            src
        );

    };


    img.src =
    src;

}



/*
   ОСНОВНОЙ РИСОВАЛЬЩИК
*/

function createText(){

    const fontSize =
    Number(size.value);


    const lineSpacing =
    Number(line.value);


    const pLeft =
    Number(pageLeft.value);


    const pRight =
    Number(pageRight.value);


    const pTop =
    Number(pageTop.value);


    const pBottom =
    Number(pageBottom.value);


    const marginLeft =
    Number(leftMargin.value);


    const xMove =
    Number(xOffset.value);


    const yMove =
    Number(yOffset.value);


    const maxWidth =
    Number(width.value);


    const realismAmount =
    Number(realism.value) / 100;


    /*
       Связный рукописный шрифт
    */

    ctx.font =
    fontSize +
    "px " +
    getFont() +
    ", cursive";


    ctx.fillStyle =
    "#294fa3";


    ctx.textBaseline =
    "alphabetic";


    /*
       Реальная ширина области листа
    */

    const sheetWidth =
    pRight - pLeft;


    /*
       Не позволяем тексту выйти
       за границу листа
    */

    const usableWidth =
    Math.min(
        maxWidth,
        sheetWidth - marginLeft - 20
    );


    /*
       Начальная координата X
    */

    let startX =
    pLeft +
    marginLeft +
    xMove;


    /*
       Начальная координата Y
    */

    let y =
    pTop +
    fontSize +
    yMove;


    /*
       Высота строки
    */

    const lineHeight =
    fontSize *
    lineSpacing;


    /*
       Берём текст ПО СТРОКАМ,
       поэтому пробелы сохраняются.
    */

    const paragraphs =
    text.value
    .replace(/\r/g,"")
    .split("\n");


    /*
       Ограничиваем область
       реальными границами листа.
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        pLeft,
        pTop,
        sheetWidth,
        pBottom - pTop
    );

    ctx.clip();


    for(
        const paragraph
        of paragraphs
    ){

        /*
           Пустая строка
        */

        if(
            paragraph.length === 0
        ){

            y += lineHeight;

            continue;

        }


        const lines =
        wrapText(
            paragraph,
            usableWidth
        );


        for(
            const currentLine
            of lines
        ){

            if(
                y >
                pBottom
            ){

                break;

            }


            /*
               Небольшая случайная
               неровность строки.
            */

            const lineY =
            y +
            random(
                -1.5 * realismAmount,
                1.5 * realismAmount
            );


            /*
               ВАЖНО:
               строка рисуется ЦЕЛИКОМ.

               Поэтому буквы внутри
               слова соединяются шрифтом,
               а не ломаются на отдельные
               символы.
            */

            ctx.save();


            const rotation =
            random(
                -0.004 * realismAmount,
                0.004 * realismAmount
            );


            /*
               Небольшое вращение
               относительно начала строки.
            */

            ctx.translate(
                startX,
                lineY
            );


            ctx.rotate(
                rotation
            );


            /*
               Очень небольшая прозрачность
               делает чернила естественнее.
            */

            ctx.globalAlpha =
            0.82 +
            random(
                0,
                0.12 * realismAmount
            );


            ctx.fillText(
                currentLine,
                0,
                0
            );


            ctx.restore();


            y += lineHeight;

        }

    }


    ctx.restore();

}



/*
   КНОПКА СОЗДАНИЯ
*/

document
.getElementById("create")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();

    }
);



/*
   СОХРАНЕНИЕ PNG
*/

document
.getElementById("save")
.addEventListener(
    "click",
    async function(){

        await document.fonts.ready;

        drawPaper();


        setTimeout(
            function(){

                const link =
                document.createElement("a");


                link.download =
                "HandWrite-A4.png";


                link.href =
                canvas.toDataURL(
                    "image/png"
                );


                link.click();

            },
            500
        );

    }
);



/*
   Автоматическое обновление
*/

[
    paper,
    style,
    size,
    line,
    pageLeft,
    pageRight,
    pageTop,
    pageBottom,
    leftMargin,
    xOffset,
    yOffset,
    width,
    realism

]
.forEach(
    function(element){

        element.addEventListener(
            "input",
            function(){

                updateValues();

                drawPaper();

            }
        );


        element.addEventListener(
            "change",
            function(){

                updateValues();

                drawPaper();

            }
        );

    }
);



updateValues();



document.fonts.ready.then(
    function(){

        drawPaper();

    }
);


</script>

</body>
</html>
